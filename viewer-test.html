<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREÑA LIVE PRO · Prueba contador</title><style>body{font-family:system-ui;background:#090b10;color:#fff;margin:0;display:grid;place-items:center;min-height:100vh}.box{width:min(520px,92vw);background:#11151d;border:1px solid #293140;border-radius:20px;padding:24px;box-shadow:0 20px 80px #0008}h1{margin:0 0 8px;font-size:25px}.muted{color:#9aa7b7;font-size:14px;line-height:1.45}label{display:block;margin-top:20px;font-weight:700}input{width:100%;box-sizing:border-box;margin-top:8px;padding:14px 16px;border-radius:12px;border:1px solid #30394a;background:#0b0e14;color:#fff;font-size:22px}button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.primary{background:#22c55e;color:#06120a}.secondary{background:#242b38;color:#fff}.danger{background:#ef4444;color:white}.status{margin-top:18px;padding:12px;border-radius:12px;background:#0b0e14;color:#cbd5e1;min-height:22px}code{color:#8be9fd}</style></head><body><div class="box"><h1>Prueba del contador TikTok</h1><div class="muted">Simula viewers sin hacer LIVE. Esto usa el mismo servidor, WebSocket y widget de GREÑA. No modifica TikTok ni se guarda al cerrar/reiniciar.</div><label>Viewers TikTok</label><input id="count" type="number" min="0" max="999999" value="100"><div class="row"><button class="primary" onclick="test()">Probar TikTok</button><button class="secondary" onclick="preset(25)">25</button><button class="secondary" onclick="preset(100)">100</button><button class="secondary" onclick="preset(444)">444</button><button class="danger" onclick="stopTest()">Salir de prueba</button></div><div id="status" class="status">Listo. Abre también <code>/viewers.html</code> para ver el widget.</div></div><script>const s=document.getElementById('status'),c=document.getElementById('count');function preset(n){c.value=n;test()}async function call(body){s.textContent='Enviando…';try{const r=await fetch('/api/viewers/test',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();s.textContent=j.ok?(j.testMode?`PRUEBA ACTIVA · TikTok ${j.viewers.tiktok} viewers`:`PRUEBA TERMINADA · contador real restaurado`):`Error: ${j.error||'desconocido'}`}catch(e){s.textContent='Error: '+e.message}}function test(){call({enabled:true,tiktok:Number(c.value)||0})}function stopTest(){call({enabled:false})}addEventListener('beforeunload',()=>{try{navigator.sendBeacon('/api/viewers/test',new Blob([JSON.stringify({enabled:false})],{type:'application/json'}))}catch{}})</script></body></html>
