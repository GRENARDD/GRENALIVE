<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Índice de Fidelidad</title>
<style>
:root{--p:#25f4ee;--p2:#fe2c55;--text:#fff;--muted:#b9c0d0;--row:64px;--gap:8px}*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text)}body{padding:10px}.board{width:min(760px,100%);min-height:390px;position:relative}.panel{border:0;border-radius:0;background:transparent;backdrop-filter:none;overflow:visible;box-shadow:none}.head{height:82px;display:flex;align-items:center;gap:14px;padding:8px 10px;position:relative;overflow:visible}.head:after{content:"";position:absolute;left:10px;width:180px;bottom:0;height:2px;background:linear-gradient(90deg,var(--p),var(--p2),transparent)}.brand{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:rgba(8,10,18,.28);border:1px solid color-mix(in srgb,var(--p) 45%,transparent);box-shadow:0 8px 22px rgba(0,0,0,.18);flex:0 0 auto}.brand img{width:29px;height:29px;object-fit:contain}.titles{min-width:0;flex:1}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.19em;color:var(--p);text-transform:uppercase}.titleline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.titleline b{font-size:24px;letter-spacing:-.03em;text-shadow:0 2px 12px rgba(0,0,0,.75)}.titleline span{font-size:12px;color:var(--muted);font-weight:700}.timer{font-size:11px;font-weight:900;color:var(--p);padding:7px 10px;border-radius:999px;background:rgba(8,10,18,.24);border:1px solid color-mix(in srgb,var(--p) 25%,transparent);text-shadow:0 1px 8px rgba(0,0,0,.8)}.rows{position:relative;height:calc(var(--row) * 5 + var(--gap) * 4);margin:12px 12px 16px}.rank-row{position:absolute;left:0;right:0;height:var(--row);display:grid;grid-template-columns:42px 42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-radius:17px;background:linear-gradient(90deg,color-mix(in srgb,var(--p) 7%,rgba(8,10,18,.34)),rgba(8,10,18,.14));border:1px solid rgba(255,255,255,.055);box-shadow:0 8px 22px rgba(0,0,0,.16);backdrop-filter:blur(5px);transition:transform .62s cubic-bezier(.2,.85,.2,1),opacity .32s ease,filter .35s ease;will-change:transform}.rank-row.first{background:linear-gradient(90deg,color-mix(in srgb,var(--p) 12%,rgba(8,10,18,.38)),rgba(8,10,18,.16));border-color:color-mix(in srgb,var(--p) 34%,transparent)}.rank{font-size:19px;font-weight:1000;text-align:center;color:var(--p)}.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;overflow:hidden;background:#171c2a;border:1px solid rgba(255,255,255,.1);font-weight:1000}.avatar img{width:100%;height:100%;object-fit:cover}.who{min-width:0}.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}.meta{display:flex;gap:7px;align-items:center;margin-top:3px;color:var(--muted);font-size:10px;font-weight:800}.level{padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07)}.score{text-align:right}.score b{display:block;font-size:18px}.score span{font-size:9px;letter-spacing:.12em;color:var(--p);font-weight:1000}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:800;padding:30px}.empty b{display:block;color:#fff;font-size:18px;margin-bottom:5px}.switching .rank-row{opacity:.22;filter:blur(2px)}.foot{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:0 12px 4px;font-size:9px;color:#a7afbf;font-weight:800;letter-spacing:.08em;text-shadow:0 2px 8px rgba(0,0,0,.9)}.pulse{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--p);box-shadow:0 0 14px var(--p);margin-right:6px}@media(max-width:560px){body{padding:5px}.head{height:80px;padding:12px}.brand{width:42px;height:42px;border-radius:13px}.brand img{width:24px;height:24px}.titleline b{font-size:19px}.rank-row{grid-template-columns:32px 36px minmax(0,1fr) auto;padding:7px 9px;gap:7px}.avatar{width:34px;height:34px}.score b{font-size:15px}}
</style></head><body><div class="board"><div class="panel" id="panel"><div class="head"><div class="brand"><img id="platformLogo" alt=""></div><div class="titles"><div class="eyebrow">ÍNDICE DE FIDELIDAD</div><div class="titleline"><b id="platformTitle">TikTok</b><span>Top de la comunidad</span></div></div><div class="timer" id="timer">8s</div></div><div class="rows" id="rows"><div class="empty" id="empty"><div><b>Aún no hay actividad</b>El ranking se genera automáticamente durante el LIVE.</div></div></div><div class="foot"><span><i class="pulse"></i>TIEMPO ACTIVO + INTERACCIÓN + APOYO</span><span id="status">EN VIVO</span></div></div></div>
<script>
(()=>{const $=id=>document.getElementById(id),platforms=['tiktok'];const info={tiktok:{name:'TikTok',p:'#25f4ee',p2:'#fe2c55',logo:'/assets/platforms/tiktok.webp'},twitch:{name:'Twitch',p:'#9146ff',p2:'#c4a7ff',logo:'/assets/platforms/twitch.webp'},kick:{name:'Kick',p:'#53fc18',p2:'#b4ff96',logo:'/assets/platforms/kick.svg'}};let state={settings:{rotateSeconds:8,topN:5},tops:{tiktok:[],twitch:[],kick:[]}},pi=0,remain=8,rows=new Map(),rotTimer=null,lastRotate=8;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function initials(n){return String(n||'?').trim().slice(0,2).toUpperCase()}function setPlatform(p,animate=true){const d=info[p],panel=$('panel');if(animate)panel.classList.add('switching');setTimeout(()=>{document.documentElement.style.setProperty('--p',d.p);document.documentElement.style.setProperty('--p2',d.p2);$('platformTitle').textContent=d.name;$('platformLogo').src=d.logo;$('platformLogo').alt=d.name;render(p);if(animate)setTimeout(()=>panel.classList.remove('switching'),40)},animate?230:0)}function render(p=platforms[pi]){const n=Math.max(3,Math.min(10,Number(state.settings?.topN)||5));document.documentElement.style.setProperty('--row',n>=8?'50px':n>=6?'56px':'64px');const box=$('rows'),gap=8,rowH=n>=8?50:n>=6?56:64;box.style.height=(n*rowH+(n-1)*gap)+'px';const list=(state.tops?.[p]||[]).slice(0,n),used=new Set();$('empty').style.display=list.length?'none':'grid';list.forEach((u,i)=>{const id=p+':'+u.id;used.add(id);let el=rows.get(id);if(!el){el=document.createElement('div');el.className='rank-row';el.style.opacity='0';box.appendChild(el);rows.set(id,el);requestAnimationFrame(()=>el.style.opacity='1')}const av=u.avatar?`<img src="${esc(u.avatar)}" alt="">`:`${esc(initials(u.nickname||u.user))}`;el.classList.toggle('first',i===0);el.innerHTML=`<div class="rank">#${i+1}</div><div class="avatar">${av}</div><div class="who"><b>${esc(u.nickname||u.user)}</b><div class="meta"><span class="level">${esc(u.level?.icon||'◇')} ${esc(u.level?.name||'Bronce')}</span><span>${Number(u.activeDays||0)} días</span></div></div><div class="score"><b>${Math.round(Number(u.score)||0).toLocaleString()}</b><span>FP</span></div>`;el.style.transform=`translateY(${i*(rowH+gap)}px)`});for(const [id,el] of rows){if(!used.has(id)){el.style.opacity='0';setTimeout(()=>{el.remove();rows.delete(id)},330)}}}function resetRotation(){clearInterval(rotTimer);remain=Math.max(3,Number(state.settings?.rotateSeconds)||8);$('timer').textContent=remain+'s';rotTimer=setInterval(()=>{remain--;if(remain<=0){pi=(pi+1)%platforms.length;remain=Math.max(3,Number(state.settings?.rotateSeconds)||8);setPlatform(platforms[pi],true)}$('timer').textContent=remain+'s'},1000)}function apply(d){if(!d)return;const nextRotate=Math.max(3,Number(d.settings?.rotateSeconds)||8),changed=nextRotate!==lastRotate;state=d;lastRotate=nextRotate;render(platforms[pi]);if(changed||!rotTimer)resetRotation()}async function load(){try{const r=await fetch('/api/loyalty?limit=10',{cache:'no-store'}),d=await r.json();if(d.ok)apply(d.loyalty)}catch{$('status').textContent='RECONECTANDO'}}function ws(){const sock=new WebSocket(`ws://${location.host}`);sock.onopen=()=>{$('status').textContent='EN VIVO'};sock.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='hello'&&d.loyalty)apply(d.loyalty);if(d.type==='loyalty-update'&&d.loyalty)apply(d.loyalty)}catch{}};sock.onclose=()=>{$('status').textContent='RECONECTANDO';setTimeout(ws,1500)};sock.onerror=()=>sock.close()}setPlatform('tiktok',false);load();ws();resetRotation()})();
</script></body></html>
