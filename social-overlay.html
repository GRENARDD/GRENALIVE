<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREÑA LIVE PRO · Redes</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}body{font-family:"Segoe UI",Arial,sans-serif}.stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:18px}.pill{--accent:#22d3ee;--opacity:.78;display:flex;align-items:center;gap:14px;min-width:120px;max-width:96%;padding:12px 22px 12px 13px;border-radius:18px;background:rgba(8,10,16,var(--opacity));border:1px solid #ffffff18;box-shadow:0 14px 38px #0007;backdrop-filter:blur(12px);transform-origin:center;opacity:0}.pill.neon{background:rgba(4,7,13,var(--opacity));box-shadow:0 0 16px color-mix(in srgb,var(--accent) 55%,transparent),inset 0 0 18px color-mix(in srgb,var(--accent) 12%,transparent)}.pill.clean{background:rgba(8,10,16,calc(var(--opacity)*.62));border-color:transparent;box-shadow:0 10px 26px #0007}.icon{width:var(--icon);height:var(--icon);display:grid;place-items:center;flex:0 0 auto}.icon img{width:100%;height:100%;object-fit:contain}.icon svg{width:68%;height:68%;display:block}.name{font-size:var(--font);font-weight:900;letter-spacing:.015em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 10px #000}.platform{font-size:11px;font-weight:900;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-bottom:1px}.copy{min-width:0}.enter{animation:enter var(--trans) cubic-bezier(.2,1.25,.3,1) forwards}.leave{animation:leave var(--trans) cubic-bezier(.6,0,.8,.2) forwards}@keyframes enter{0%{opacity:0;transform:translateX(-42px) scale(.72) rotate(-3deg)}65%{opacity:1;transform:translateX(5px) scale(1.04)}100%{opacity:1;transform:none}}@keyframes leave{0%{opacity:1;transform:none}100%{opacity:0;transform:translateX(42px) scale(.78) rotate(3deg)}}
</style></head><body><div class="stage"><div id="pill" class="pill"><div id="icon" class="icon"></div><div class="copy"><div id="platform" class="platform"></div><div id="name" class="name"></div></div></div></div><script>
const defaults={tiktokUser:'',twitchUser:'',kickUser:'',fontFamily:'Segoe UI',fontSize:34,iconSize:46,textColor:'#ffffff',accent:'#22d3ee',panelOpacity:78,holdSeconds:4,transitionSeconds:.65,style:'glass',uppercase:false,showAt:true};let cfg={...defaults},idx=0,timer=null,previewOverride=false;const pill=document.getElementById('pill'),icon=document.getElementById('icon'),nameEl=document.getElementById('name'),platformEl=document.getElementById('platform');
const icons={tiktok:`<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#25F4EE" d="M29 6c1.1 5.4 4.2 8.6 9 9.3v7.1c-3.2.1-6.2-.9-9-2.7v12.1c0 7.2-5.8 12.9-13 12.9S3 38.9 3 31.8s5.8-13 13-13c.8 0 1.6.1 2.4.2v7.2a6 6 0 0 0-2.4-.5 6.1 6.1 0 1 0 6.1 6.1V6H29Z"/><path fill="#FE2C55" d="M32 5c1.1 5.4 4.2 8.6 9 9.3v5.1c-4.5-.5-8-2.4-11-5.5v18c0 7.2-5.8 12.9-13 12.9-3 0-5.8-1-8-2.7a13 13 0 0 0 20.1-10.8V18.7c2.8 1.8 5.8 2.8 9 2.7v-4.1C33.3 16.6 30.2 13.4 29 8V5h3Z"/><path fill="#fff" d="M27 8v23.8a10 10 0 1 1-8.6-9.9v4.3a6.1 6.1 0 1 0 4.7 5.9V8H27Z"/></svg>`,kick:`<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="8" fill="#53FC18"/><path d="M10 9h9v11h4l7-11h10L30 24l10 15H30l-7-11h-4v11h-9V9Z" fill="#050505"/></svg>`,twitch:`<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#9146FF" d="M7 4h36v25L32 40h-8l-6 6v-6H7V4Z"/><path fill="#fff" d="M13 9v25h8v6l6-6h7l5-5V9H13Zm9 17h-4V15h4v11Zm10 0h-4V15h4v11Z"/></svg>`};
function normalizedUser(v){v=String(v||'').trim();if(!v)return '';if(cfg.showAt&&!v.startsWith('@'))v='@'+v;if(!cfg.showAt)v=v.replace(/^@/,'');return cfg.uppercase?v.toUpperCase():v}
function apply(){document.body.style.fontFamily=cfg.fontFamily||defaults.fontFamily;pill.style.setProperty('--font',(Number(cfg.fontSize)||34)+'px');pill.style.setProperty('--icon',(Number(cfg.iconSize)||46)+'px');pill.style.setProperty('--text',cfg.textColor||'#fff');pill.style.setProperty('--accent',cfg.accent||'#22d3ee');pill.style.setProperty('--opacity',Math.max(0,Math.min(100,Number(cfg.panelOpacity)||78))/100);pill.style.setProperty('--trans',(Number(cfg.transitionSeconds)||.65)+'s');pill.className='pill '+(cfg.style||'glass')}
function show(){clearTimeout(timer);const items=[['tiktok','TikTok',cfg.tiktokUser]].filter(x=>String(x[2]||'').trim());if(!items.length){pill.style.opacity=0;return}const it=items[idx%items.length];idx++;apply();icon.innerHTML=icons[it[0]];platformEl.textContent=it[1];nameEl.textContent=normalizedUser(it[2]);pill.classList.remove('leave','enter');void pill.offsetWidth;pill.classList.add('enter');timer=setTimeout(()=>{pill.classList.remove('enter');pill.classList.add('leave');timer=setTimeout(show,(Number(cfg.transitionSeconds)||.65)*1000+260)},Math.max(1,Number(cfg.holdSeconds)||4)*1000)}
async function load(){try{const r=await fetch('/api/social-settings?x='+Date.now());const d=await r.json();cfg={...defaults,...d.settings};show()}catch{show()}}
window.addEventListener('message',e=>{if(e.data?.type==='grena-social-preview'&&e.data.settings){previewOverride=true;cfg={...defaults,...e.data.settings};show()}});
load();setInterval(async()=>{try{const r=await fetch('/api/social-settings?x='+Date.now());const d=await r.json();const n=JSON.stringify(d.settings||{});if(!previewOverride&&n!==JSON.stringify(cfg)){cfg={...defaults,...d.settings};show()}}catch{}},1500);try{const ws=new WebSocket(`ws://${location.host}`);ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='hello'&&d.socialSettings&&!previewOverride){cfg={...defaults,...d.socialSettings};show()}if(d.type==='social-settings'&&!previewOverride){cfg={...defaults,...d.settings};show()}}catch{}}}catch{}
</script></body></html>
