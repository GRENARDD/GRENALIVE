<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREÑA LIVE · Redes en línea</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}body{font-family:Arial,"Segoe UI",sans-serif;color:#fff}.stage{width:100%;height:100%;display:flex;align-items:center;padding:0 12px;justify-content:flex-start}.networks{display:flex;align-items:center;justify-content:flex-start;gap:var(--gap,24px);white-space:nowrap;max-width:100%}.network{display:inline-flex;align-items:center;gap:9px;color:#fff;font-size:var(--font,24px);font-weight:400;line-height:1.2;white-space:nowrap;will-change:transform,opacity;opacity:1;transform:translateY(0)}.network .icon{width:var(--icon,31px);height:var(--icon,31px);display:grid;place-items:center;flex:none}.network .icon svg,.network .icon img{width:100%;height:100%;object-fit:contain;filter:grayscale(1) brightness(0) invert(1)}.network.out{animation:goDown var(--transition,.65s) ease-in forwards}.network.in{animation:goUp var(--transition,.65s) ease-out forwards}@keyframes goDown{to{transform:translateY(35px);opacity:0}}@keyframes goUp{from{transform:translateY(35px);opacity:0}to{transform:translateY(0);opacity:1}}@media(prefers-reduced-motion:reduce){.network.out,.network.in{animation-duration:.01s}}
</style></head><body><div id="stage" class="stage"><div id="networks" class="networks"></div></div><script>
const defaults={tiktokUser:'',instagramUser:'',twitchUser:'',kickUser:'',youtubeUser:'',starviosUser:'',enabledNetworks:['tiktok','instagram','twitch','kick','youtube','starvios'],fontFamily:'Arial',fontSize:24,iconSize:31,holdSeconds:4,transitionSeconds:.65,showAt:true,edge:'left',edgeOffset:0};
const platforms=['tiktok','instagram','twitch','kick','youtube','starvios'];let cfg={...defaults},timer=null,token=0,previewOverride=false;const stage=document.getElementById('stage'),host=document.getElementById('networks');
const icons={instagram:`<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.1"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.3"/><circle cx="18" cy="6.3" r="1.2" stroke="none" fill="white"/></svg>`,starvios:`<img src="/assets/platforms/starvios.svg" alt="Starvios">`,youtube:`<svg viewBox="0 0 48 48"><rect y="7" width="48" height="34" rx="9" fill="#FF0033"/><path d="M20 16v16l14-8z" fill="#fff"/></svg>`,tiktok:`<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#25F4EE" d="M29 6c1.1 5.4 4.2 8.6 9 9.3v7.1c-3.2.1-6.2-.9-9-2.7v12.1c0 7.2-5.8 12.9-13 12.9S3 38.9 3 31.8s5.8-13 13-13c.8 0 1.6.1 2.4.2v7.2a6 6 0 0 0-2.4-.5 6.1 6.1 0 1 0 6.1 6.1V6H29Z"/><path fill="#FE2C55" d="M32 5c1.1 5.4 4.2 8.6 9 9.3v5.1c-4.5-.5-8-2.4-11-5.5v18c0 7.2-5.8 12.9-13 12.9-3 0-5.8-1-8-2.7a13 13 0 0 0 20.1-10.8V18.7c2.8 1.8 5.8 2.8 9 2.7v-4.1C33.3 16.6 30.2 13.4 29 8V5h3Z"/><path fill="#fff" d="M27 8v23.8a10 10 0 1 1-8.6-9.9v4.3a6.1 6.1 0 1 0 4.7 5.9V8H27Z"/></svg>`,kick:`<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="8" fill="#53FC18"/><path d="M10 9h9v11h4l7-11h10L30 24l10 15H30l-7-11h-4v11h-9V9Z" fill="#050505"/></svg>`,twitch:`<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#9146FF" d="M7 4h36v25L32 40h-8l-6 6v-6H7V4Z"/><path fill="#fff" d="M13 9v25h8v6l6-6h7l5-5V9H13Zm9 17h-4V15h4v11Zm10 0h-4V15h4v11Z"/></svg>`};
function names(){const enabled=Array.isArray(cfg.enabledNetworks)?cfg.enabledNetworks:platforms;return platforms.filter(p=>enabled.includes(p)&&String(cfg[p+'User']||'').trim())}
function username(raw){let v=String(raw||'').trim();if(!v)return '';if(cfg.showAt===false)return v.replace(/^@/,'');return v.startsWith('@')?v:'@'+v}
function render(){token++;clearTimeout(timer);host.replaceChildren();const namesToShow=names();stage.style.justifyContent=cfg.edge==='right'?'flex-end':'flex-start';stage.style.paddingLeft=cfg.edge==='right'?'0px':Math.max(0,Number(cfg.edgeOffset)||0)+'px';stage.style.paddingRight=cfg.edge==='right'?Math.max(0,Number(cfg.edgeOffset)||0)+'px':'0px';host.style.setProperty('--font',Math.max(12,Number(cfg.fontSize)||24)+'px');host.style.setProperty('--icon',Math.max(15,Number(cfg.iconSize)||31)+'px');host.style.setProperty('--transition',Math.max(.1,Number(cfg.transitionSeconds)||.65)+'s');host.style.setProperty('--gap','24px');host.style.fontFamily=cfg.fontFamily||'Arial';for(const p of namesToShow){const item=document.createElement('span');item.className='network';item.dataset.network=p;const mark=document.createElement('span');mark.className='icon';mark.innerHTML=icons[p]||'';const label=document.createElement('span');label.textContent=username(cfg[p+'User']);item.append(mark,label);host.append(item)}if(namesToShow.length)cycle(token)}
function cycle(id){if(id!==token)return;const list=[...host.querySelectorAll('.network')];if(!list.length)return;const duration=Math.max(100,(Number(cfg.transitionSeconds)||.65)*1000),delay=Math.max(800,(Number(cfg.holdSeconds)||4)*1000);timer=setTimeout(()=>{if(id!==token)return;list.forEach((el,i)=>setTimeout(()=>{if(id!==token)return;el.classList.remove('in');el.classList.add('out')},i*180));timer=setTimeout(()=>{if(id!==token)return;list.forEach((el,i)=>setTimeout(()=>{if(id!==token)return;el.classList.remove('out');void el.offsetWidth;el.classList.add('in')},i*180));timer=setTimeout(()=>cycle(id),duration+list.length*180+180)},duration+list.length*180+220)},delay)}
async function load(){try{const r=await fetch('/api/social-settings?x='+Date.now());if(r.ok){const d=await r.json();cfg={...defaults,...d.settings}}}catch{}render()}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='grena-social-preview'&&e.data.settings){previewOverride=true;cfg={...defaults,...e.data.settings};render()}});
load();setInterval(async()=>{if(previewOverride)return;try{const r=await fetch('/api/social-settings?x='+Date.now());if(!r.ok)return;const d=await r.json();const next={...defaults,...d.settings};if(JSON.stringify(next)!==JSON.stringify(cfg)){cfg=next;render()}}catch{}},2000);
</script></body></html>
