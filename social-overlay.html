<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREÑA LIVE · Redes en línea</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;color:#fff}.stage{height:100%;width:100%;display:flex;justify-content:center;align-items:center}.networks{display:flex;align-items:center;justify-content:center;gap:30px;padding:18px 25px;max-width:100%;flex-wrap:nowrap}.network{display:flex;align-items:center;gap:8px;white-space:nowrap;color:white;opacity:1;transform:translateY(0);transition:transform 600ms cubic-bezier(.33,0,.2,1),opacity 500ms ease;will-change:transform,opacity;font-size:19px;font-weight:400;line-height:1.25}.network.down{opacity:0;transform:translateY(38px)}.network .icon{width:23px;height:23px;flex-shrink:0;display:flex;align-items:center}.network .icon svg{width:23px;height:23px;fill:white;stroke:white}.network .icon svg[fill="none"]{fill:none}.network .icon svg[fill="none"] circle:last-child{fill:white}@media(max-width:1050px){.networks{gap:18px}.network{font-size:15px}.network .icon,.network .icon svg{width:19px;height:19px}}@media(max-width:650px){.networks{gap:11px;padding:8px}.network{font-size:12px}.network .icon,.network .icon svg{width:15px;height:15px}}@media(prefers-reduced-motion:reduce){.network{transition:none}}</style></head><body><div id="stage" class="stage"><div id="networks" class="networks"></div></div><script>
const defaults={tiktokUser:'',instagramUser:'',twitchUser:'',kickUser:'',youtubeUser:'',starviosUser:'',enabledNetworks:['tiktok','instagram','twitch','kick','youtube','starvios'],fontFamily:'Arial',fontSize:24,iconSize:31,holdSeconds:4,transitionSeconds:.65,showAt:true,edge:'left',edgeOffset:0};
const platforms=['tiktok','instagram','twitch','kick','youtube','starvios'];let cfg={...defaults},timer=null,token=0,previewOverride=false;const stage=document.getElementById('stage'),host=document.getElementById('networks');
const icons={
tiktok:`<svg viewBox="0 0 24 24"><path d="M16.5 2c.2 3 1.8 4.7 4.5 4.9v3.4a10.2 10.2 0 0 1-4.6-1.2v6.7c0 4.4-3.2 7.2-7.3 7.2a7.3 7.3 0 0 1-7-7.3c0-4 3.2-7.2 7.2-7.2.5 0 1 .05 1.5.16v3.8c-.5-.2-1-.3-1.5-.3a3.6 3.6 0 1 0 3.5 3.6V2z"/></svg>`,
instagram:`<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="2.7" y="2.7" width="18.6" height="18.6" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.9" cy="6.5" r="1.1" fill="white" stroke="none"/></svg>`,
twitch:`<svg viewBox="0 0 24 24"><path d="M3 2h19v13l-5.6 5.6h-4.2L9 24H6v-3.4H2V6zM5.3 4.3v13.8h4.8v2.3l2.3-2.3h4l3.3-3.3V4.3zm5.2 3h2.2v6.4h-2.2zm5.3 0H18v6.4h-2.2z"/></svg>`,
kick:`<svg viewBox="0 0 24 24"><path d="M3 2h6v8h3V7h3V4h6v6h-3v4h3v6h-6v-3h-3v-3H9v8H3z"/></svg>`,
youtube:`<svg viewBox="0 0 24 24"><path d="M23 7.1a2.8 2.8 0 0 0-2-2C19.2 4.6 12 4.6 12 4.6s-7.2 0-9 .5a2.8 2.8 0 0 0-2 2C.5 8.9.5 12 .5 12s0 3.1.5 4.9a2.8 2.8 0 0 0 2 2c1.8.5 9 .5 9 .5s7.2 0 9-.5a2.8 2.8 0 0 0 2-2c.5-1.8.5-4.9.5-4.9s0-3.1-.5-4.9ZM9.6 15.5v-7l6.2 3.5z"/></svg>`,
starvios:`<svg viewBox="0 0 24 24"><path d="m12 1.5 3.1 6.4 7.1 1-5.1 5 .9 7.1-6-3.3-6.2 3.3 1.2-7.1-5.2-5 7.2-1z"/></svg>`
};
function names(){const enabled=Array.isArray(cfg.enabledNetworks)?cfg.enabledNetworks:platforms;return platforms.filter(p=>enabled.includes(p)&&String(cfg[p+'User']||'').trim())}
function username(raw){let v=String(raw||'').trim();if(!v)return '';if(cfg.showAt===false)return v.replace(/^@/,'');return v.startsWith('@')?v:'@'+v}
function render(){
  token++;clearTimeout(timer);host.replaceChildren();const visible=names();
  stage.style.justifyContent='center';
  host.style.fontFamily='Arial, Helvetica, sans-serif';
  for(const p of visible){const item=document.createElement('div');item.className='network';item.dataset.network=p;const mark=document.createElement('span');mark.className='icon';mark.innerHTML=icons[p];const label=document.createElement('span');label.textContent=username(cfg[p+'User']);item.append(mark,label);host.append(item)}
  if(visible.length)cycle(token);
}
async function cycle(id){
  const wait=ms=>new Promise(resolve=>{timer=setTimeout(resolve,ms)});
  while(id===token){
    await wait(Math.max(800,Number(cfg.holdSeconds||2.8)*1000));if(id!==token)return;
    const list=[...host.querySelectorAll('.network')];
    for(const el of list){if(id!==token)return;el.classList.add('down');await wait(260)}
    await wait(1150);if(id!==token)return;
    for(const el of list){if(id!==token)return;el.classList.remove('down');await wait(260)}
    await wait(1200);
  }
}
async function load(){try{const r=await fetch('/api/social-settings?x='+Date.now());if(r.ok){const d=await r.json();cfg={...defaults,...d.settings}}}catch{}render()}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='grena-social-preview'&&e.data.settings){previewOverride=true;cfg={...defaults,...e.data.settings};render()}});
load();setInterval(async()=>{if(previewOverride)return;try{const r=await fetch('/api/social-settings?x='+Date.now());if(!r.ok)return;const d=await r.json();const next={...defaults,...d.settings};if(JSON.stringify(next)!==JSON.stringify(cfg)){cfg=next;render()}}catch{}},2000);
</script></body></html>
