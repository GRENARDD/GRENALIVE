# Isolated Android TikTok event relay branch. Desktop Railway main remains on its own Dockerfile.
[build]
builder = "NIXPACKS"
buildCommand = "npm --prefix mobile-relay install --omit=dev"

[deploy]
startCommand = "npm --prefix mobile-relay start"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
