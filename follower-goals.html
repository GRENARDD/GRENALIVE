<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREÑA · Meta de seguidores</title>
<style>
:root{
  --bg:#070912;
  --panel:#0b0e17;
  --panel2:#101521;
  --text:#fff;
  --muted:#a6afc1;
  --gold:#ffd53a;
  --pink:#ff2b79;
  --cyan:#21efff;
  --purple:#9a54ff;
  --green:#54ff28;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:transparent;
  font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text)
}
body{display:flex;align-items:center;justify-content:center}
.stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:8px}

.goal-template{
  position:relative;width:100%;
  background:
    radial-gradient(circle at 18% 12%,#ff2b7920,transparent 26%),
    radial-gradient(circle at 78% 0%,#7457ff1b,transparent 24%),
    linear-gradient(180deg,#0c1020f4,#070912f5);
  border:3px solid #080a11;border-radius:28px;
  box-shadow:0 16px 42px #0009,inset 0 0 0 1px #ffffff12;
  overflow:hidden;
}
.goal-template:before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  padding:3px;
  background:linear-gradient(110deg,#ff2b79,#9b54ff,#20eaff,#53ff27,#ffd43d,#ff2b79);
  background-size:260% 100%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:borderShift 8s linear infinite
}
.goal-template:after{
  content:"";position:absolute;left:-8%;right:-8%;bottom:-80px;height:130px;
  background:radial-gradient(ellipse at center,#ff9d1f38,transparent 70%);
  pointer-events:none
}
.header{
  position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
  gap:18px;padding:18px 22px 11px
}
.title{
  font-weight:1000;letter-spacing:.035em;font-size:28px;line-height:1;
  color:#fff;text-shadow:0 4px 0 #05060a,0 0 22px #ff2b7955
}
.live-pill{
  flex:0 0 auto;font-size:10px;font-weight:1000;letter-spacing:.12em;
  padding:7px 11px;border-radius:999px;background:#ffffff0c;
  border:1px solid #ffffff1a;color:#d8deea
}

.horizontal-template{max-width:none;padding-bottom:18px}
.cards{
  position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;padding:0 18px
}
.card{
  --accent:#fff;--accent2:#fff;
  position:relative;min-width:0;padding:13px 14px 15px;border-radius:20px;
  background:linear-gradient(180deg,#080a11f2,#10131df2);
  border:2px solid color-mix(in srgb,var(--accent) 70%,#ffffff20);
  box-shadow:inset 0 0 20px color-mix(in srgb,var(--accent) 8%,transparent),0 10px 24px #0006;
  transition:opacity .2s ease,transform .2s ease
}
.card.off{display:none}
.card.tiktok{--accent:var(--pink);--accent2:var(--cyan)}
.card.twitch{--accent:var(--purple);--accent2:#6b39ff}
.card.kick{--accent:var(--green);--accent2:#1ec700}
.brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:1000;text-transform:uppercase}
.brand img{width:25px;height:25px;object-fit:contain;filter:drop-shadow(0 3px 5px #0008)}
.value{
  margin:9px 0 10px;font-size:32px;font-weight:1000;letter-spacing:-.045em;line-height:1;
  text-shadow:0 4px 0 #000,0 0 14px #000
}
.current{color:var(--gold)}
.sep{color:#fff;opacity:.96}
.track{
  height:15px;padding:2px;border-radius:999px;background:#06070d;
  border:1px solid #ffffff2b;box-shadow:inset 0 2px 8px #000d
}
.fill{
  width:0;height:100%;border-radius:inherit;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  box-shadow:0 0 16px color-mix(in srgb,var(--accent) 65%,transparent);
  transition:width .75s cubic-bezier(.2,.9,.2,1)
}
.remaining{margin-top:8px;font-size:11px;font-weight:900;color:#aeb7c8}
.remaining b{color:#fff}
.value.bump{animation:numberBump .58s ease}

.vertical-template{
  width:100%;max-width:none;padding-bottom:15px
}
.vertical-template .header{padding-bottom:10px}
.vertical-template .title{font-size:22px}
.vertical-card{
  --accent:var(--pink);--accent2:var(--cyan);
  position:relative;z-index:2;display:grid;grid-template-columns:72px 1fr;align-items:center;gap:15px;
  margin:0 16px;padding:12px 14px;border-radius:22px;
  background:linear-gradient(180deg,#080a11f3,#111521f3);
  border:2px solid color-mix(in srgb,var(--accent) 72%,#ffffff20);
  box-shadow:inset 0 0 20px color-mix(in srgb,var(--accent) 8%,transparent),0 10px 24px #0006
}
.vertical-card.twitch{--accent:var(--purple);--accent2:#6b39ff}
.vertical-card.kick{--accent:var(--green);--accent2:#1ec700}
.platform-badge{
  width:72px;height:72px;border-radius:20px;display:grid;place-items:center;
  background:#05070b;border:2px solid #ffffff16;
  box-shadow:0 9px 24px #0008,inset 0 0 20px color-mix(in srgb,var(--accent) 12%,transparent)
}
.platform-badge img{width:43px;height:43px;object-fit:contain}
.vertical-content .brand{font-size:11px;color:#dce2ee;margin-bottom:5px}
.vertical-content .value{font-size:46px;margin:0 0 10px}
.vertical-content .track{height:17px}
.vertical-content .remaining{font-size:12px}
.pulse-dot{
  width:7px;height:7px;border-radius:50%;background:#62ffb4;display:inline-block;margin-right:6px;
  box-shadow:0 0 10px #62ffb4
}

@media(max-width:720px){
  .header{padding:14px 14px 10px}
  .title{font-size:21px}
  .cards{gap:7px;padding:0 12px}
  .card{padding:10px 9px 12px}
  .brand{font-size:10px}.brand img{width:21px;height:21px}
  .value{font-size:25px}
  .remaining{font-size:9px}
}
@media(max-width:520px){
  .cards{grid-template-columns:1fr}
  .title{font-size:18px}
}

@keyframes borderShift{0%{background-position:0 0}100%{background-position:260% 0}}
@keyframes numberBump{0%{transform:scale(1)}38%{transform:scale(1.18);filter:brightness(1.6)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="stage">
  <section class="goal-template horizontal-template" id="horizontal">
    <div class="header">
      <div class="title">META DE SEGUIDORES</div>
      <div class="live-pill"><span class="pulse-dot"></span>GREÑA LIVE</div>
    </div>

    <div class="cards">
      <article class="card tiktok" data-card="tiktok">
        <div class="brand"><img src="/assets/platforms/tiktok.webp" alt=""><span>TikTok</span></div>
        <div class="value" data-value="tiktok"><span class="current">0</span> <span class="sep">/</span> <span class="goal">100</span></div>
        <div class="track"><div class="fill" data-fill="tiktok"></div></div>
        <div class="remaining" data-remaining="tiktok"><b>+100</b> para la meta</div>
      </article>

      <article class="card twitch" data-card="twitch">
        <div class="brand"><img src="/assets/platforms/twitch.webp" alt=""><span>Twitch</span></div>
        <div class="value" data-value="twitch"><span class="current">0</span> <span class="sep">/</span> <span class="goal">10</span></div>
        <div class="track"><div class="fill" data-fill="twitch"></div></div>
        <div class="remaining" data-remaining="twitch"><b>+10</b> para la meta</div>
      </article>

      <article class="card kick" data-card="kick">
        <div class="brand"><img src="/assets/platforms/kick.svg" alt=""><span>Kick</span></div>
        <div class="value" data-value="kick"><span class="current">0</span> <span class="sep">/</span> <span class="goal">10</span></div>
        <div class="track"><div class="fill" data-fill="kick"></div></div>
        <div class="remaining" data-remaining="kick"><b>+10</b> para la meta</div>
      </article>
    </div>
  </section>

  <section class="goal-template vertical-template" id="vertical" hidden>
    <div class="header">
      <div class="title">META DE SEGUIDORES</div>
      <div class="live-pill" id="verticalPlatformName">TIKTOK</div>
    </div>
    <article class="vertical-card tiktok" id="verticalCard">
      <div class="platform-badge"><img id="verticalIcon" src="/assets/platforms/tiktok.webp" alt=""></div>
      <div class="vertical-content">
        <div class="brand" id="verticalBrand">TikTok</div>
        <div class="value" id="verticalValue"><span class="current">0</span> <span class="sep">/</span> <span class="goal">100</span></div>
        <div class="track"><div class="fill" id="verticalFill"></div></div>
        <div class="remaining" id="verticalRemaining"><b>+100</b> para la meta</div>
      </div>
    </article>
  </section>
</div>

<script>
const defs={
  tiktok:{name:'TikTok',icon:'/assets/platforms/tiktok.webp'},
  twitch:{name:'Twitch',icon:'/assets/platforms/twitch.webp'},
  kick:{name:'Kick',icon:'/assets/platforms/kick.svg'}
};
let state={
  settings:{
    tiktok:{start:0,goal:100,show:true},
    twitch:{start:0,goal:10,show:true},
    kick:{start:0,goal:10,show:true}
  },
  gained:{tiktok:0,twitch:0,kick:0}
};
const previous={tiktok:null,twitch:null,kick:null};
const params=new URLSearchParams(location.search);
const mode=(params.get('layout')||'horizontal').toLowerCase()==='vertical'?'vertical':'horizontal';

document.getElementById('horizontal').hidden=mode!=='horizontal';
document.getElementById('vertical').hidden=mode!=='vertical';

function current(p){
  const s=state.settings?.[p]||{};
  return Math.max(0,Number(s.current ?? (Number(s.start||0)+Number(state.gained?.[p]||0))));
}
function goal(p){return Math.max(1,Number(state.settings?.[p]?.goal||1))}
function shown(p){return state.settings?.[p]?.show!==false}
function percent(p){return Math.max(0,Math.min(100,current(p)/goal(p)*100))}
function fmt(n){return Number(n||0).toLocaleString('es-DO')}

function bump(el){
  if(!el)return;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(()=>el.classList.remove('bump'),650);
}
function updateHorizontal(){
  for(const p of ['tiktok','twitch','kick']){
    const cur=current(p),g=goal(p),left=Math.max(0,g-cur);
    const card=document.querySelector('[data-card="'+p+'"]');
    card.classList.toggle('off',!shown(p));
    card.querySelector('.current').textContent=fmt(cur);
    card.querySelector('.goal').textContent=fmt(g);
    document.querySelector('[data-fill="'+p+'"]').style.width=percent(p)+'%';
    document.querySelector('[data-remaining="'+p+'"]').innerHTML=cur>=g?'<b>¡META COMPLETADA!</b>':'<b>+'+fmt(left)+'</b> para la meta';
    if(previous[p]!=null&&cur>previous[p])bump(document.querySelector('[data-value="'+p+'"]'));
    previous[p]=cur;
  }
}
function updateVertical(){
  const p=['tiktok','twitch','kick'].find(shown)||'tiktok';
  const cur=current(p),g=goal(p),left=Math.max(0,g-cur);
  const card=document.getElementById('verticalCard');
  card.className='vertical-card '+p;
  document.getElementById('verticalIcon').src=defs[p].icon;
  document.getElementById('verticalBrand').textContent=defs[p].name;
  document.getElementById('verticalPlatformName').textContent=defs[p].name.toUpperCase();
  document.querySelector('#verticalValue .current').textContent=fmt(cur);
  document.querySelector('#verticalValue .goal').textContent=fmt(g);
  document.getElementById('verticalFill').style.width=percent(p)+'%';
  document.getElementById('verticalRemaining').innerHTML=cur>=g?'<b>¡META COMPLETADA!</b>':'<b>+'+fmt(left)+'</b> para la meta';
  if(previous[p]!=null&&cur>previous[p])bump(document.getElementById('verticalValue'));
  previous[p]=cur;
}
function update(){mode==='vertical'?updateVertical():updateHorizontal()}

async function load(){
  try{
    const r=await fetch('/api/follower-goals',{cache:'no-store'});
    if(!r.ok)return;
    state=await r.json();
    update();
  }catch{}
}
function connectWs(){
  try{
    const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);
    ws.onmessage=e=>{
      try{
        const d=JSON.parse(e.data);
        if(d.type==='follower-goals'&&d.state){state=d.state;update()}
      }catch{}
    };
    ws.onclose=()=>setTimeout(connectWs,1800);
    ws.onerror=()=>{try{ws.close()}catch{}};
  }catch{setTimeout(connectWs,2200)}
}
update();
load();
connectWs();
setInterval(load,12000);
</script>
</body>
</html>
