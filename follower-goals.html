<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREÑA · Meta de seguidores</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center}
#viewport{position:relative;width:100vw;height:100vh;overflow:hidden}
#w{position:absolute;left:50%;top:50%;width:1420px;height:362px;transform-origin:50% 50%;will-change:transform}
.base{position:absolute;inset:0;background:url('/assets/follower-goal-template.webp') center/100% 100% no-repeat}
#aura{animation:aura 2.4s ease-in-out infinite}
@keyframes aura{0%,100%{filter:drop-shadow(0 0 5px #1e90ff55);opacity:.98}50%{filter:drop-shadow(0 0 12px #4fc3ff88) drop-shadow(0 0 24px #0057ff44);opacity:1}}
#fclip{position:absolute;inset:0;clip-path:polygon(0 70px,100px 70px,100px 160px,0 160px);pointer-events:none}
#fclip:before{content:"";position:absolute;inset:0;background:url('/assets/follower-goal-template.webp') center/100% 100% no-repeat;transform-origin:62px 155px;animation:finger 1.1s ease-in-out infinite}
@keyframes finger{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg) translateY(-3px)}}
.num{position:absolute;top:196px;width:300px;margin-left:-150px;text-align:center;font:900 66px/72px 'Arial Black',Impact,Arial,sans-serif;background:linear-gradient(#fff2a0,#ffc928 45%,#ff8c00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7a3a00) drop-shadow(0 0 4px #000);white-space:nowrap;letter-spacing:-2px}
.num.pop{animation:pop .5s ease}
@keyframes pop{50%{transform:scale(1.18)}}
.bar{position:absolute;top:274px;height:50px;border-radius:26px;background:#2a2a30;box-shadow:inset 0 0 0 4px #6e6e78;overflow:hidden}
.fill{position:absolute;left:5px;top:5px;bottom:5px;width:0;border-radius:22px;background:var(--c);box-shadow:0 0 14px var(--c);transition:width .8s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.fill:before{content:"";position:absolute;left:0;right:0;top:0;height:40%;background:#ffffff40}
.fill:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff7,transparent);transform:translateX(-100%);animation:shine 2.6s linear infinite}
@keyframes shine{to{transform:translateX(100%)}}
.runtime.off{display:none}
</style>
</head>
<body>
<div id="viewport"><div id="w"><div class="base" id="aura"></div><div id="fclip"></div><div id="ui"></div></div></div>
<script>
const P={
 tiktok:{value:0,goal:100,color:'#ff2d78',cx:415,bx:238,bw:340},
 twitch:{value:0,goal:10,color:'#9146ff',cx:790,bx:626,bw:340},
 kick:{value:0,goal:10,color:'#33ee22',cx:1175,bx:1014,bw:322}
};
const q=new URLSearchParams(location.search),ui=document.getElementById('ui');
const shown={tiktok:null,twitch:null,kick:null};
let state={settings:{tiktok:{start:0,goal:100,show:true},twitch:{start:0,goal:10,show:true},kick:{start:0,goal:10,show:true}},gained:{tiktok:0,twitch:0,kick:0}};
for(const k of Object.keys(P)){
 const p=P[k],wrap=document.createElement('div');
 wrap.className='runtime';wrap.dataset.runtime=k;
 const n=document.createElement('div');n.className='num';n.id='n-'+k;n.style.left=p.cx+'px';
 const bar=document.createElement('div');bar.className='bar';bar.style.left=p.bx+'px';bar.style.width=p.bw+'px';bar.style.setProperty('--c',p.color);
 const fill=document.createElement('div');fill.className='fill';fill.id='f-'+k;bar.append(fill);wrap.append(n,bar);ui.append(wrap);
}
function fit(){
 const W=1420,H=362,vw=Math.max(1,innerWidth),vh=Math.max(1,innerHeight);
 let scale=Math.min(vw/W,vh/H),manual=Number(q.get('scale'));
 if(Number.isFinite(manual)&&manual>0)scale*=manual;
 document.getElementById('w').style.transform='translate(-50%,-50%) scale('+scale+')';
}
addEventListener('resize',fit);fit();
function current(k){const s=state.settings?.[k]||{};return Math.max(0,Number(s.current ?? (Number(s.start||0)+Number(state.gained?.[k]||0)))||0)}
function goal(k){return Math.max(1,Number(state.settings?.[k]?.goal||P[k].goal)||1)}
function enabled(k){return state.settings?.[k]?.show!==false}
function fmt(n){return Math.max(0,Math.round(Number(n)||0)).toLocaleString('es-DO')}
function render(k){
 const p=P[k],n=document.getElementById('n-'+k),bar=document.getElementById('f-'+k),wrap=document.querySelector('[data-runtime="'+k+'"]');
 const target=current(k),g=goal(k),from=shown[k]??target;wrap.classList.toggle('off',!enabled(k));
 const t0=performance.now();
 (function step(now){const r=Math.min((now-t0)/520,1),eased=1-Math.pow(1-r,3);n.textContent=fmt(from+(target-from)*eased)+' / '+fmt(g);if(r<1)requestAnimationFrame(step)})(t0);
 bar.style.width=(Math.max(0,Math.min(1,target/g))*(p.bw-10))+'px';
 if(shown[k]!=null&&target>shown[k]){n.classList.remove('pop');void n.offsetWidth;n.classList.add('pop')}
 shown[k]=target;
}
function renderAll(){for(const k of Object.keys(P))render(k)}
async function load(){try{const r=await fetch('/api/follower-goals',{cache:'no-store'});if(!r.ok)return;state=await r.json();renderAll()}catch{}}
function connectWs(){try{const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='follower-goals'&&d.state){state=d.state;renderAll()}}catch{}};ws.onclose=()=>setTimeout(connectWs,1800);ws.onerror=()=>{try{ws.close()}catch{}}}catch{setTimeout(connectWs,2200)}}
renderAll();load();connectWs();setInterval(load,12000);
</script>
</body>
</html>
