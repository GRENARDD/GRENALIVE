<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREÑA · Meta de seguidores</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff}.wrap{width:min(760px,96vw);padding:10px}.card{position:relative;padding:18px 20px 16px;border:1px solid #ffffff1f;border-radius:22px;background:linear-gradient(145deg,#10141ee8,#080b12e8);box-shadow:0 18px 55px #0008;backdrop-filter:blur(14px);overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.title{font-weight:950;letter-spacing:.13em;font-size:13px}.live{font-size:10px;font-weight:900;color:#9aa8bd}.rows{display:grid;gap:10px}.row{display:grid;grid-template-columns:116px 1fr 92px;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:900}.brand img{width:25px;height:25px;object-fit:contain}.track{height:12px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff12;overflow:hidden}.fill{height:100%;width:0;border-radius:inherit;transition:width .8s cubic-bezier(.2,.9,.25,1);box-shadow:0 0 18px currentColor}.tiktok .fill{background:linear-gradient(90deg,#25f4ee,#fe2c55)}.twitch .fill{background:linear-gradient(90deg,#7040d9,#a970ff)}.kick .fill{background:linear-gradient(90deg,#39d40b,#53fc18)}.num{text-align:right;font-size:15px;font-weight:950}.num small{font-size:10px;color:#8190a7}.row.bump .num{animation:bump .6s}.row.done{animation:done 1.2s}.row.done .track{box-shadow:0 0 24px #fff5}.foot{margin-top:12px;text-align:center;font-size:9px;font-weight:800;letter-spacing:.12em;color:#657188}@keyframes bump{40%{transform:scale(1.18);text-shadow:0 0 18px #fff}100%{transform:none}}@keyframes done{35%{filter:brightness(1.8);transform:scale(1.015)}100%{filter:none;transform:none}}
</style></head><body><div class="wrap"><div class="card"><div class="top"><div class="title">META DE SEGUIDORES</div><div class="live">GREÑA LIVE</div></div><div class="rows" id="rows"></div><div class="foot">TIKTOK · TWITCH · KICK</div></div></div><script>
const defs={tiktok:{name:'TikTok',icon:'/assets/platforms/tiktok.webp'},twitch:{name:'Twitch',icon:'/assets/platforms/twitch.webp'},kick:{name:'Kick',icon:'/assets/platforms/kick.svg'}};let state={settings:{tiktok:{start:0,goal:100,show:true},twitch:{start:0,goal:10,show:true},kick:{start:0,goal:10,show:true}},gained:{tiktok:0,twitch:0,kick:0}};let prev={};
function draw(){const box=document.getElementById('rows');box.innerHTML='';for(const p of ['tiktok','twitch','kick']){const s=state.settings[p]||{},cur=Math.max(0,Number(s.current??(Number(s.start||0)+Number(state.gained[p]||0)))),goal=Math.max(1,Number(s.goal||1));if(s.show===false)continue;const r=document.createElement('div');r.className='row '+p+(cur>=goal?' done':'');r.innerHTML='<div class="brand"><img src="'+defs[p].icon+'"><span>'+defs[p].name+'</span></div><div class="track"><div class="fill" style="width:'+Math.min(100,cur/goal*100)+'%"></div></div><div class="num">'+cur.toLocaleString('es-DO')+' <small>/</small> '+goal.toLocaleString('es-DO')+'</div>';if(prev[p]!=null&&cur>prev[p])r.classList.add('bump');prev[p]=cur;box.append(r)}}
async function load(){try{const r=await fetch('/api/follower-goals',{cache:'no-store'});if(r.ok)state=await r.json();draw()}catch{}}
const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='follower-goals'){state=d.state;draw()}}catch{}};load();setInterval(load,15000);
</script></body></html>
