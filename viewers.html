<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREÑA LIVE PRO · Contador de espectadores</title>
<script>
(() => {
  document.documentElement.dataset.counterStyle = 'classic';
  document.documentElement.style.setProperty('--vertical-card', '#18232c');
})();
</script>
<style>
*{box-sizing:border-box}
:root{--vertical-card:#18232c}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:transparent!important;
  font-family:Inter,Segoe UI,Arial,sans-serif
}
.stage{
  width:100%;height:100vh;display:flex;align-items:center;justify-content:center;
  gap:14px;padding:12px 0;background:transparent
}
.vertical-title{display:none}
.counters{display:flex;align-items:center;justify-content:center;gap:14px;max-width:100%}
.counter{
  min-width:150px;
  padding:12px 15px 11px;
  border-radius:14px;
  color:#fff;
  background:rgba(9,11,18,.88);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 10px 28px rgba(0,0,0,.28);
}
.platform{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.platform img{width:25px;height:25px;object-fit:contain;display:block}
.platform span{font-size:11px;letter-spacing:.08em;font-weight:800;color:#d9deea}
.count{
  display:block;font-size:38px;line-height:1;font-weight:900;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums
}
.tt{border-color:rgba(37,244,238,.22)}
.tw{border-color:rgba(145,70,255,.30)}
.ki{border-color:rgba(83,252,24,.30)}
.yt{border-color:rgba(255,0,51,.35)}.sv{border-color:rgba(255,131,196,.38)}.sv .platform span{color:#ffaddb}
.counter.is-hidden{display:none!important}
.pulse{animation:pulse .32s ease}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ===== TRÍO LIVE: logos + espectadores ===== */
html[data-counter-style="trio"] .stage{gap:0;padding:20px 0}
html[data-counter-style="trio"] .counters{gap:56px}
html[data-counter-style="trio"] .counter{
  min-width:130px;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px
}
html[data-counter-style="trio"] .platform{display:contents}
html[data-counter-style="trio"] .platform img{
  order:1;width:48px;height:48px;object-fit:contain;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.28))
}
html[data-counter-style="trio"] .count{
  order:2;color:#fff;font-size:54px;line-height:1;font-weight:650;letter-spacing:-1.5px;
  min-width:96px;text-align:center;text-shadow:0 3px 12px rgba(0,0,0,.58)
}
html[data-counter-style="trio"] .platform span{
  order:3;color:rgba(255,255,255,.72);font-weight:700;font-size:13px;
  letter-spacing:.13em;text-transform:uppercase;text-shadow:0 2px 7px rgba(0,0,0,.55)
}
html[data-counter-style="trio"] .ki .platform img{width:49px;height:49px}
html[data-counter-style="trio"] .pulse{animation:trioPulse .28s ease-out}
@keyframes trioPulse{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}

/* ===== PANEL VERTICAL: diseño de la nueva prueba ===== */
html[data-counter-style="vertical"] .stage{gap:28px;padding:18px 0}
html[data-counter-style="vertical"] .vertical-title{
  display:flex;min-width:245px;flex-direction:column;justify-content:center;color:#fff;
  text-shadow:0 3px 12px rgba(0,0,0,.58)
}
html[data-counter-style="vertical"] .vertical-title strong{
  font-size:35px;line-height:1.02;font-weight:900;letter-spacing:-1.2px
}
html[data-counter-style="vertical"] .vertical-title small{
  margin-top:5px;color:rgba(255,255,255,.72);font-size:18px;font-weight:800
}
html[data-counter-style="vertical"] .counters{flex-direction:column;gap:7px}
html[data-counter-style="vertical"] .counter{
  width:250px;height:66px;min-width:250px;padding:0 14px 0 0;border-radius:7px;
  display:grid;grid-template-columns:72px 1fr;align-items:center;
  background:var(--vertical-card);border:1px solid rgba(255,255,255,.11);
  box-shadow:0 5px 12px rgba(0,0,0,.36);overflow:hidden
}
html[data-counter-style="vertical"] .platform{height:100%;display:flex;align-items:center;justify-content:center;margin:0}
html[data-counter-style="vertical"] .platform img{
  width:45px;height:45px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.28))
}
html[data-counter-style="vertical"] .platform span{display:none}
html[data-counter-style="vertical"] .count{
  color:#fff;text-align:right;padding-right:2px;font-size:34px;line-height:1;font-weight:900;
  letter-spacing:-.025em;text-shadow:0 2px 6px rgba(0,0,0,.45)
}
html[data-counter-style="vertical"] .tt,
html[data-counter-style="vertical"] .tw,
html[data-counter-style="vertical"] .ki{border-color:rgba(255,255,255,.11)}
html[data-counter-style="vertical"] .ki .platform img{width:46px;height:46px}
html[data-counter-style="vertical"] .sv{border-color:rgba(255,120,192,.32)}
html[data-counter-style="vertical"] .pulse{animation:verticalPulse .24s ease-out}
@keyframes verticalPulse{0%{transform:scale(1)}48%{transform:scale(1.12)}100%{transform:scale(1)}}

@media(max-width:720px){
  html[data-counter-style="trio"] .counters{gap:28px;transform:scale(.86)}
  html[data-counter-style="trio"] .counter{min-width:110px}
  html[data-counter-style="vertical"] .stage{gap:16px;transform:scale(.86)}
}
html[data-counter-style="grena-viewers"] .stage{padding:0;gap:0;justify-content:center!important}html[data-counter-style="grena-viewers"] .counters,html[data-counter-style="grena-viewers"] .vertical-title{display:none!important}html:not([data-counter-style="grena-viewers"]) #grenaViewersCounter{display:none!important}#grenaViewersCounter{width:100%;height:100%;border:0;background:transparent;flex:1 1 auto}

html[data-counter-style="grena-total"] .stage{justify-content:flex-start!important;align-items:flex-start!important;padding-top:0!important;gap:0!important}
html[data-counter-style="grena-total"] .counters,html[data-counter-style="grena-total"] .vertical-title,html:not([data-counter-style="grena-total"]) #grenaTotalCounter{display:none!important}
#grenaTotalCounter{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:white;text-shadow:0 0 3px #000,0 2px 4px #000,0 0 10px rgba(0,0,0,.95),0 0 20px rgba(0,0,0,.7);padding:18px 22px;background:transparent;min-width:230px;box-sizing:border-box}
#grenaTotalCounter .gt-total{display:flex;gap:12px;align-items:center}
#grenaTotalCounter .gt-eye,#grenaTotalCounter .gt-icon{width:34px;height:34px;flex:none;filter:drop-shadow(0 0 3px #000) drop-shadow(0 2px 5px rgba(0,0,0,.9))}
#grenaTotalCounter .gt-number{font-size:44px;font-weight:800;line-height:1;letter-spacing:.5px}
#grenaTotalCounter .gt-label{font-size:12px;letter-spacing:2px;opacity:.75;margin-top:4px}
#grenaTotalCounter .gt-rows{margin-top:14px;display:flex;flex-direction:column;gap:10px}
#grenaTotalCounter .gt-row{display:flex;align-items:center;gap:12px}
#grenaTotalCounter .gt-row[hidden]{display:none!important}
#grenaTotalCounter .gt-count{font-size:26px;font-weight:700;line-height:1}
#grenaTotalCounter .gt-handle{font-size:12px;opacity:.7}

</style>
</head>
<body>
<main class="stage" aria-label="Contador de espectadores">
  <section class="vertical-title" aria-hidden="true">
    <strong>Contador de<br>espectadores</strong>
    <small>Widget</small>
  </section>

  <iframe id="grenaViewersCounter" title="GREÑA Viewers sin Total" src="/viewers-grena-original.html" aria-label="Contadores GREÑA de espectadores por plataforma"></iframe>
<section id="grenaTotalCounter" aria-label="Total de espectadores y usuarios vinculados"><div class="gt-total"><svg class="gt-eye" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3.5" fill="#fff"/></svg><div><div class="gt-number" id="gtTotal">0</div><div class="gt-label">TOTAL VIEWERS</div></div></div><div class="gt-rows"><div class="gt-row" data-gt-row="tiktok" hidden><svg class="gt-icon" viewBox="0 0 34 34"><rect width="34" height="34" rx="8" fill="#111"/><path transform="translate(5 5)" fill="#25F4EE" d="M13 3v11.2a3 3 0 1 1-2.2-2.9V8a6 6 0 1 0 5.2 5.9V8.6c1 .8 2.3 1.3 3.6 1.3V6.5C17.8 6.5 16 5 16 3z"/><path transform="translate(7 6)" fill="#FE2C55" d="M13 3v11.2a3 3 0 1 1-2.2-2.9V8a6 6 0 1 0 5.2 5.9V8.6c1 .8 2.3 1.3 3.6 1.3V6.5C17.8 6.5 16 5 16 3z" opacity=".85"/></svg><div><div class="gt-count" data-gt-count="tiktok">0</div><div class="gt-handle" data-gt-handle="tiktok"></div></div></div><div class="gt-row" data-gt-row="kick" hidden><svg class="gt-icon" viewBox="0 0 34 34"><rect width="34" height="34" rx="6" fill="#53FC18"/><path fill="#000" d="M9 7h5v6h2l3-6h5l-4.5 8.5L25 27h-5.5L16 20.5h-2V27H9z"/></svg><div><div class="gt-count" data-gt-count="kick">0</div><div class="gt-handle" data-gt-handle="kick"></div></div></div><div class="gt-row" data-gt-row="twitch" hidden><svg class="gt-icon" viewBox="0 0 34 34"><rect width="34" height="34" rx="6" fill="#9146FF"/><path fill="#fff" d="M8 7h18v12l-5 5h-4l-3 3v-3H8zm3 3v10h4v2l2-2h4l3-3V10zm6 2h2v5h-2zm5 0h2v5h-2z"/></svg><div><div class="gt-count" data-gt-count="twitch">0</div><div class="gt-handle" data-gt-handle="twitch"></div></div></div><div class="gt-row" data-gt-row="youtube" hidden><svg class="gt-icon" viewBox="0 0 34 34"><rect y="5" width="34" height="24" rx="7" fill="#F00"/><path fill="#fff" d="M14 11.5l9 5.5-9 5.5z"/></svg><div><div class="gt-count" data-gt-count="youtube">0</div><div class="gt-handle" data-gt-handle="youtube"></div></div></div></div></section>
  <div class="counters">
    <section class="counter tt is-hidden">
      <div class="platform">
        <img src="/assets/platforms/tiktok.webp" alt="TikTok">
        <span>TikTok</span>
      </div>
      <strong id="tt" class="count">0</strong>
    </section>

    <section class="counter tw is-hidden">
      <div class="platform">
        <img src="/assets/platforms/twitch.webp" alt="Twitch">
        <span>Twitch</span>
      </div>
      <strong id="tw" class="count">0</strong>
    </section>

    <section class="counter yt is-hidden"><div class="platform"><img src="/assets/youtube-logo.svg" alt="YouTube"><span>YouTube</span></div><strong id="yt" class="count">0</strong></section>

    <section class="counter ki is-hidden">
      <div class="platform">
        <img src="/assets/platforms/kick-viewer.png" alt="Kick">
        <span>Kick</span>
      </div>
      <strong id="ki" class="count">0</strong>
    </section>
  </div>
</main>

<script>
const originalViewersFrame=document.getElementById('grenaViewersCounter');const obsToken=new URLSearchParams(location.search).get('obs');if(obsToken){const u=new URL(originalViewersFrame.src,location.origin);u.searchParams.set('obs',obsToken);originalViewersFrame.src=u.toString()}

const gtCurrent={total:0},gtFrames={};
function gtTween(key,el,to){
 cancelAnimationFrame(gtFrames[key]);const from=gtCurrent[key]||0,start=performance.now(),duration=700;
 function step(now){const x=Math.min(1,(now-start)/duration);const next=from+(to-from)*(1-Math.pow(1-x,3));gtCurrent[key]=next;el.textContent=Math.round(next).toLocaleString('en-US');if(x<1)gtFrames[key]=requestAnimationFrame(step)}
 gtFrames[key]=requestAnimationFrame(step);
}
function drawGrenaTotal(v={},accounts={}){
 let total=0;
 for(const k of ['tiktok','kick','twitch','youtube']){
  const row=document.querySelector('[data-gt-row="'+k+'"]');
  const n=Math.max(0,Math.trunc(Number(v[k])||0));
  const visible=n>0&&activePlatforms.includes(k);
  row.hidden=!visible;
  if(!visible)continue;
  total+=n;
  gtTween(k,row.querySelector('[data-gt-count]'),n);
  const account=String(accounts[k]||'').trim();
  row.querySelector('[data-gt-handle]').textContent=account || 'Cuenta vinculada';
 }
 gtTween('total',document.getElementById('gtTotal'),total);
}

const old={tiktok:-1,twitch:-1,kick:-1,youtube:-1};
const counterDefaults={style:'classic',counterCardColor:'#18232c',edge:'left',edgeOffset:0};
let counterSettings={...counterDefaults};
let previewOverride=false;
let latestMeta={};
let activePlatforms=[];let latestAccounts={};

function updatePlatformVisibility(v={}){
 for(const [k,selector] of [['tiktok','.counter.tt'],['twitch','.counter.tw'],['kick','.counter.ki'],['youtube','.counter.yt']]){
  const card=document.querySelector(selector);if(!card)continue;
  const n=Number(v[k]);
  card.classList.toggle('is-hidden',!(Number.isFinite(n)&&n>=1&&activePlatforms.includes(k)));
  // Zero or offline platforms never occupy slots, including trio and vertical styles.
 }
}

function normalizeCounterSettings(v={}){
  const style=['classic','trio','vertical','grena-viewers','grena-total'].includes(String(v.style||''))?String(v.style):'classic';
  const raw=String(v.counterCardColor||v.cardColor||'#18232c').trim();
  const counterCardColor=/^#[0-9a-fA-F]{6}$/.test(raw)?raw.toLowerCase():'#18232c';
  const edge=v.edge==='right'?'right':'left';
  const edgeOffset=Math.max(0,Math.min(80,Number(v.edgeOffset)||0));
  return {style,counterCardColor,edge,edgeOffset};
}
function applyCounterSettings(v={}){
  counterSettings=normalizeCounterSettings(v);
  document.documentElement.dataset.counterStyle=counterSettings.style;
  document.documentElement.style.setProperty('--vertical-card',counterSettings.counterCardColor);
   const stage=document.querySelector('.stage'),right=counterSettings.edge==='right',gap=counterSettings.edgeOffset;
   stage.style.justifyContent=right?'flex-end':'flex-start';
   stage.style.paddingLeft=(right?0:gap)+'px';stage.style.paddingRight=(right?gap:0)+'px';
   stage.style.transformOrigin=right?'right center':'left center';
}
function draw(v={},meta,accounts){if(accounts&&typeof accounts==='object')latestAccounts=accounts;drawGrenaTotal(v,latestAccounts);
  if(meta&&typeof meta==='object')latestMeta=meta;
  for(const [k,id] of [['tiktok','tt'],['twitch','tw'],['kick','ki'],['youtube','yt']]){
    const n=Math.max(0,Math.floor(Number(v[k])||0));
    const e=document.getElementById(id);
    const label=n.toLocaleString('es-DO');
    if(old[k]!==label){
      e.textContent=label;
      e.classList.remove('pulse');
      void e.offsetWidth;
      e.classList.add('pulse');
      old[k]=label;
    }
  }
  updatePlatformVisibility(v,latestMeta);
}

let pollTimer=null;
async function poll(){
  try{
    const [vr,sr]=await Promise.all([fetch('/api/viewers',{cache:'no-store'}),fetch('/api/counter-settings',{cache:'no-store'})]);
    if(vr.ok){const d=await vr.json();activePlatforms=Array.isArray(d.activePlatforms)?d.activePlatforms:[];draw(d.viewers,d.meta,d.accounts)}
    if(sr.ok){const d=await sr.json();if(d.settings&&!previewOverride)applyCounterSettings(d.settings)}
  }catch{}
  clearTimeout(pollTimer);
  pollTimer=setTimeout(poll,1500);
}

window.addEventListener('message',e=>{
  if(e.data?.type==='grena-counter-preview'&&e.data.settings){previewOverride=true;applyCounterSettings(e.data.settings)}
});

let socket=null;
let wsRetry=null;
function ws(){
  clearTimeout(wsRetry);
  try{
    const protocol=location.protocol==='https:'?'wss':'ws';
    socket=new WebSocket(`${protocol}://${location.host}`);
    socket.onmessage=e=>{
      try{
        const d=JSON.parse(e.data);
        if(d.type==='hello'){if(d.viewers){activePlatforms=Array.isArray(d.activePlatforms)?d.activePlatforms:activePlatforms;draw(d.viewers,d.meta,d.accounts)};if(d.counterSettings&&!previewOverride)applyCounterSettings(d.counterSettings)}
        if(d.type==='viewers'&&d.viewers){activePlatforms=Array.isArray(d.activePlatforms)?d.activePlatforms:[];draw(d.viewers,d.meta,d.accounts)}
        if(d.type==='counter-settings'&&d.settings&&!previewOverride)applyCounterSettings(d.settings);
      }catch{}
    };
    socket.onclose=()=>{socket=null;wsRetry=setTimeout(ws,1500)};
    socket.onerror=()=>{try{socket.close()}catch{}};
  }catch{wsRetry=setTimeout(ws,1500)}
}

applyCounterSettings(counterDefaults);
poll();
ws();
</script>
</body>
</html>
