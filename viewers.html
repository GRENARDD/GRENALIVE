<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREÑA LIVE PRO · Contador de espectadores</title>
<script>
(() => {
  document.documentElement.dataset.counterStyle = 'classic';
  document.documentElement.style.setProperty('--vertical-card', '#18232c');
})();
</script>
<style>
*{box-sizing:border-box}
:root{--vertical-card:#18232c}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:transparent!important;
  font-family:Inter,Segoe UI,Arial,sans-serif
}
.stage{
  width:100%;height:100vh;display:flex;align-items:center;justify-content:center;
  gap:14px;padding:12px;background:transparent
}
.vertical-title{display:none}
.counters{display:flex;align-items:center;justify-content:center;gap:14px}
.counter{
  min-width:150px;
  padding:12px 15px 11px;
  border-radius:14px;
  color:#fff;
  background:rgba(9,11,18,.88);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 10px 28px rgba(0,0,0,.28);
}
.platform{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.platform img{width:25px;height:25px;object-fit:contain;display:block}
.platform span{font-size:11px;letter-spacing:.08em;font-weight:800;color:#d9deea}
.count{
  display:block;font-size:38px;line-height:1;font-weight:900;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums
}
.tt{border-color:rgba(37,244,238,.22)}
.tw{border-color:rgba(145,70,255,.30)}
.ki{border-color:rgba(83,252,24,.30)}
.pulse{animation:pulse .32s ease}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ===== TRÍO LIVE: logos + espectadores ===== */
html[data-counter-style="trio"] .stage{gap:0;padding:20px 28px}
html[data-counter-style="trio"] .counters{gap:56px}
html[data-counter-style="trio"] .counter{
  min-width:130px;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px
}
html[data-counter-style="trio"] .platform{display:contents}
html[data-counter-style="trio"] .platform img{
  order:1;width:48px;height:48px;object-fit:contain;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.28))
}
html[data-counter-style="trio"] .count{
  order:2;color:#fff;font-size:54px;line-height:1;font-weight:650;letter-spacing:-1.5px;
  min-width:96px;text-align:center;text-shadow:0 3px 12px rgba(0,0,0,.58)
}
html[data-counter-style="trio"] .platform span{
  order:3;color:rgba(255,255,255,.72);font-weight:700;font-size:13px;
  letter-spacing:.13em;text-transform:uppercase;text-shadow:0 2px 7px rgba(0,0,0,.55)
}
html[data-counter-style="trio"] .ki .platform img{width:49px;height:49px}
html[data-counter-style="trio"] .pulse{animation:trioPulse .28s ease-out}
@keyframes trioPulse{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}

/* ===== PANEL VERTICAL: diseño de la nueva prueba ===== */
html[data-counter-style="vertical"] .stage{gap:28px;padding:18px 24px}
html[data-counter-style="vertical"] .vertical-title{
  display:flex;min-width:245px;flex-direction:column;justify-content:center;color:#fff;
  text-shadow:0 3px 12px rgba(0,0,0,.58)
}
html[data-counter-style="vertical"] .vertical-title strong{
  font-size:35px;line-height:1.02;font-weight:900;letter-spacing:-1.2px
}
html[data-counter-style="vertical"] .vertical-title small{
  margin-top:5px;color:rgba(255,255,255,.72);font-size:18px;font-weight:800
}
html[data-counter-style="vertical"] .counters{flex-direction:column;gap:7px}
html[data-counter-style="vertical"] .counter{
  width:250px;height:66px;min-width:250px;padding:0 14px 0 0;border-radius:7px;
  display:grid;grid-template-columns:72px 1fr;align-items:center;
  background:var(--vertical-card);border:1px solid rgba(255,255,255,.11);
  box-shadow:0 5px 12px rgba(0,0,0,.36);overflow:hidden
}
html[data-counter-style="vertical"] .platform{height:100%;display:flex;align-items:center;justify-content:center;margin:0}
html[data-counter-style="vertical"] .platform img{
  width:45px;height:45px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.28))
}
html[data-counter-style="vertical"] .platform span{display:none}
html[data-counter-style="vertical"] .count{
  color:#fff;text-align:right;padding-right:2px;font-size:34px;line-height:1;font-weight:900;
  letter-spacing:-.025em;text-shadow:0 2px 6px rgba(0,0,0,.45)
}
html[data-counter-style="vertical"] .tt,
html[data-counter-style="vertical"] .tw,
html[data-counter-style="vertical"] .ki{border-color:rgba(255,255,255,.11)}
html[data-counter-style="vertical"] .ki .platform img{width:46px;height:46px}
html[data-counter-style="vertical"] .pulse{animation:verticalPulse .24s ease-out}
@keyframes verticalPulse{0%{transform:scale(1)}48%{transform:scale(1.12)}100%{transform:scale(1)}}

@media(max-width:720px){
  html[data-counter-style="trio"] .counters{gap:28px;transform:scale(.86)}
  html[data-counter-style="trio"] .counter{min-width:110px}
  html[data-counter-style="vertical"] .stage{gap:16px;transform:scale(.86)}
}
.tw,.ki{display:none!important}.wrap,.cards{max-width:100%!important}
</style>
</head>
<body>
<main class="stage" aria-label="Contador de espectadores">
  <section class="vertical-title" aria-hidden="true">
    <strong>Contador de<br>espectadores</strong>
    <small>Widget</small>
  </section>

  <div class="counters">
    <section class="counter tt">
      <div class="platform">
        <img src="/assets/platforms/tiktok.webp" alt="TikTok">
        <span>TikTok</span>
      </div>
      <strong id="tt" class="count">0</strong>
    </section>

    <section class="counter tw">
      <div class="platform">
        <img src="/assets/platforms/twitch.webp" alt="Twitch">
        <span>Twitch</span>
      </div>
      <strong id="tw" class="count">0</strong>
    </section>

    <section class="counter ki">
      <div class="platform">
        <img src="/assets/platforms/kick-viewer.png" alt="Kick">
        <span>Kick</span>
      </div>
      <strong id="ki" class="count">0</strong>
    </section>
  </div>
</main>

<script>
const old={tiktok:-1};
const counterDefaults={style:'classic',counterCardColor:'#18232c'};
let counterSettings={...counterDefaults};
let previewOverride=false;

function normalizeCounterSettings(v={}){
  const style=['classic','trio','vertical'].includes(String(v.style||''))?String(v.style):'classic';
  const raw=String(v.counterCardColor||v.cardColor||'#18232c').trim();
  const counterCardColor=/^#[0-9a-fA-F]{6}$/.test(raw)?raw.toLowerCase():'#18232c';
  return {style,counterCardColor};
}
function applyCounterSettings(v={}){
  counterSettings=normalizeCounterSettings(v);
  document.documentElement.dataset.counterStyle=counterSettings.style;
  document.documentElement.style.setProperty('--vertical-card',counterSettings.counterCardColor);
}
function draw(v={}){
  for(const [k,id] of [['tiktok','tt']]){
    const n=Math.max(0,Math.floor(Number(v[k])||0));
    const e=document.getElementById(id);
    if(old[k]!==n){
      e.textContent=n.toLocaleString('es-DO');
      e.classList.remove('pulse');
      void e.offsetWidth;
      e.classList.add('pulse');
      old[k]=n;
    }
  }
}

let pollTimer=null;
async function poll(){
  try{
    const [vr,sr]=await Promise.all([fetch('/api/viewers',{cache:'no-store'}),fetch('/api/counter-settings',{cache:'no-store'})]);
    if(vr.ok){const d=await vr.json();draw(d.viewers)}
    if(sr.ok){const d=await sr.json();if(d.settings&&!previewOverride)applyCounterSettings(d.settings)}
  }catch{}
  clearTimeout(pollTimer);
  pollTimer=setTimeout(poll,3000);
}

window.addEventListener('message',e=>{
  if(e.data?.type==='grena-counter-preview'&&e.data.settings){previewOverride=true;applyCounterSettings(e.data.settings)}
});

let socket=null;
let wsRetry=null;
function ws(){
  clearTimeout(wsRetry);
  try{
    const protocol=location.protocol==='https:'?'wss':'ws';
    socket=new WebSocket(`${protocol}://${location.host}`);
    socket.onmessage=e=>{
      try{
        const d=JSON.parse(e.data);
        if(d.type==='hello'){if(d.viewers)draw(d.viewers);if(d.counterSettings&&!previewOverride)applyCounterSettings(d.counterSettings)}
        if(d.type==='viewers'&&d.viewers)draw(d.viewers);
        if(d.type==='counter-settings'&&d.settings&&!previewOverride)applyCounterSettings(d.settings);
      }catch{}
    };
    socket.onclose=()=>{socket=null;wsRetry=setTimeout(ws,1500)};
    socket.onerror=()=>{try{socket.close()}catch{}};
  }catch{wsRetry=setTimeout(ws,1500)}
}

applyCounterSettings(counterDefaults);
poll();
ws();
</script>
</body>
</html>
