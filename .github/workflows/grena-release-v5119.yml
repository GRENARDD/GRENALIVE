name: GREÑA · Publicar Desktop v5.1.19 estable
on:
  workflow_run:
    workflows:
      - GREÑA LIVE Desktop (kit de integración)
    types:
      - completed
    branches:
      - main
permissions:
  contents: write
  actions: read
jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: '5.1.19'
      TESTED_RUN: ${{ github.event.workflow_run.id }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Skip when v5.1.19 is already official
        id: existing_release
        shell: bash
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION ya está publicada. Los cambios siguientes deben salir como una nueva versión."
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Windows build, current HEAD and release identity
        if: steps.existing_release.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo 'El código de main cambió después de compilar; no publicar un instalador antiguo'; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" --jq .head_sha)" = "$TESTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" --jq .event)" = push
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" --jq .head_branch)" = main
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v5.1.19 ya existe. No sobrescribir una versión oficial.'
            exit 1
          fi
      - name: Download and verify compiled 5.1.19 Windows installer
        if: steps.existing_release.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          gh run download "$TESTED_RUN" --repo "$GITHUB_REPOSITORY" --name GRENA-LIVE-Installer-Windows-v5.1.19 --dir dist-release
          mapfile -t installers < <(find dist-release -maxdepth 2 -type f -iname '*5.1.19.exe' -size +60000k)
          test "${#installers[@]}" -eq 1 || { echo "Se esperaba exactamente un instalador estable 5.1.19 (encontrados: ${#installers[@]})"; exit 1; }
          installer="${installers[0]}"
          test -s "$installer"
          mv "$installer" dist-release/GRENA.LIVE.Setup.5.1.19.exe
          exe='GRENA.LIVE.Setup.5.1.19.exe'
          size="$(stat -c '%s' "dist-release/$exe")"
          hash="$(openssl dgst -sha512 -binary "dist-release/$exe" | base64 -w0)"
          test "${#hash}" -ge 70
          printf 'version: %s\nfiles:\n  - url: %s\n    sha512: %s\n    size: %s\npath: %s\nsha512: %s\nreleaseDate: %s\n' "$VERSION" "$exe" "$hash" "$size" "$exe" "$hash" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-release/latest.yml
          ( cd dist-release && sha256sum "$exe" > SHA256SUMS.txt )
          test -s dist-release/latest.yml
      - name: Publish official v5.1.19 release (not Cloudflare rollout)
        if: steps.existing_release.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          GREÑA Live Desktop v5.1.19 — YouTube en GREÑA Auth y actualizaciones de panel

          - Vinculación de YouTube centralizada a través de GREÑA Auth en Cloudflare, sin secretos de Google en la aplicación.
          - Panel de multistream y mejoras de alertas según la rama de integración, sujetos a validación funcional.
          - Cada usuario obtiene un nuevo turno de voz como mínimo 7 segundos después de su anterior entrada aceptada; los mensajes rechazados no reinician el intervalo.
          - Cola de voz inteligente y limitada a 16 mensajes, orden por dueño, moderadores, seguidores/suscriptores y espectadores, y orden de llegada dentro de cada nivel.
          - Twitch transmite comentarios al multichat sin esperar la foto o la comprobación de seguidor; muestra los mensajes del streamer.
          - Kick minimiza omisiones de mensajes repetidos legítimos con una ventana de respaldo de 1.5 segundos.
          - TikTok mantiene diagnóstico de comentarios recibidos, reenviados, silenciados y sin texto; los filtros de voz siguen separados del chat visible.
          - Conserva las cinco voces Fish Audio, TTS natural sin cambiar velocidad, credenciales individuales, alertas y transparencias de OBS.
          - Instalación y actualización comprobadas por la verificación automática desde GREÑA Live 5.1.17, conservando perfil, conexiones y ajustes Fish.
          - El instalador se publica en GitHub Releases. El propietario controla por separado la aprobación de actualización automática en Cloudflare.
          
          Aviso: la firma Authenticode depende de que el certificado Windows esté configurado; SmartScreen puede mostrar una advertencia.
          EOF
          gh release create "v$VERSION" dist-release/GRENA.LIVE.Setup.5.1.19.exe dist-release/latest.yml dist-release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$TESTED_SHA" --title "GREÑA Live Desktop v$VERSION" --notes-file release-notes.md
