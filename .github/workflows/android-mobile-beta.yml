name: GREÑA Live Mobile · APK BETA
on:
  push:
    branches:
      - feature/grena-live-mobile-android-v0-1-20261103
      - feature/grena-live-mobile-android-v0-2-settings-20261103
      - feature/grena-android-v0-3-icon-draggable-chat-server-safe-20261103
      - fix/android-v0-3-1-live-status-overlay-20261103
      - feature/android-cloudflare-multiplatform-20261103
    paths:
      - "mobile-android/**"
      - ".github/workflows/android-mobile-beta.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build Android debug APK (independent)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK API 35 (runner SDK)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager missing"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build untrusted debug APK
        run: gradle -p mobile-android --no-daemon :app:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: GRENA_Live_Mobile_v0.4_DEV_APK
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
