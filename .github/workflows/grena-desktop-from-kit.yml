name: GREÑA LIVE Desktop (kit de integración)
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/desktop-obs-starvios-youtube-20261022'
    tags:
      - 'v*'
    paths:
      - GRENA_LIVE_Desktop_v5_Kit.zip
      - 'desktop-build/**'
      - 'index.html'
      - 'control-center.js'
      - 'afterglow-overlay.html'
      - 'assets/alerts-theme-picker.js'
      - 'tests/desktop-connections-obs.test.cjs'
      - '.github/workflows/grena-desktop-from-kit.yml'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify and apply GREÑA Desktop integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "GRENA_LIVE_Desktop_v5_Kit.zip")) {
            throw "Falta GRENA_LIVE_Desktop_v5_Kit.zip en la raiz del repositorio. No se modifica la app."
          }
          Expand-Archive -Path "GRENA_LIVE_Desktop_v5_Kit.zip" -DestinationPath ".kit" -Force
          python -c "import zipfile; z=zipfile.ZipFile('GRENA_LIVE_Desktop_v5_Kit.zip'); print('Kit paths:', [n for n in z.namelist() if any(k in n.lower() for k in ('domino','minecraft','overlay','alert','index','control-center'))][:100])"
          python -c "from pathlib import Path; p=Path('.kit/GRENA_LIVE_Desktop_v5/tools/aplicar_a_grena.py'); print('Kit integration logic:', '\\n'.join(f'{i+1}: {ln}' for i,ln in enumerate(p.read_text(encoding='utf-8').splitlines()) if any(w in ln.lower() for w in ['def patch','replace_one','theme','domino','minecraft3d','afterglow-overlay'])))"
          python ".kit/GRENA_LIVE_Desktop_v5/tools/aplicar_a_grena.py" "." --dry-run
          python ".kit/GRENA_LIVE_Desktop_v5/tools/aplicar_a_grena.py" "."
      - name: Fix Node backend packaging and enable startup diagnosis
        shell: pwsh
        run: |
          python desktop-build/fix_startup.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/fix_oauth.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check server.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify pack logic
        shell: pwsh
        run: |
          node --test assets/grena-packs/domino/tests/domino.test.js assets/grena-packs/domino/tests/system.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test assets/grena-packs/minecraft/tests/phase1.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/desktop-connections-obs.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/voice-emoji-filter.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer (manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publish Windows installer for updates (release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always
      - name: Smoke test compiled Windows backend
        shell: pwsh
        run: ./desktop-build/smoke.ps1
      - name: Upload the Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: GRENA-LIVE-Installer-Windows-v5.0.4
          path: dist/*.exe
          if-no-files-found: error
