name: GREÑA LIVE Desktop (kit de integración)
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'grena-gamer.css'
      - 'favicon.svg'
      - 'chat-server.mjs'
      - 'chat-realtime-guard.mjs'
      - 'assets/grena-g-icon.png.base64'
      - 'server.mjs'
      - 'mobile.html'
      - 'tests/mobile-afterglow-superfans.test.mjs'
      - 'assets/mobile.webmanifest'
      - 'assets/qr-code.min.js'
      - 'mobile-device.html'
      - 'super-fans-overlay.html'
      - 'kick-realtime.mjs'
      - 'tests/kick-*.test.mjs'
      - 'grena-tokens.css'
      - 'grena-avatar.js'
      - 'control-center.js'
      - 'grena-community.js'
      - 'grena-licensing.mjs'
      - 'fish-owner-vault.cjs'
      - 'fish-user-vault.cjs'
      - 'license-admin.html'
      - 'license.html'
      - 'mode.html'
      - 'login.html'
      - 'index.html'
      - 'dynamics.html'
      - 'dynamics/**'
      - 'live-panel.html'
      - 'mobile.html'
      - 'custom-alerts.html'
      - 'chat.html'
      - 'afterglow-overlay.html'
      - 'assets/grena-mascot-alerts.html'
      - 'assets/grenito-original-alerts.html'
      - 'tests/voice-http-fallback.test.mjs'
      - 'tests/obs-mascot-alpha-pixels.test.mjs'
      - 'alerts.html'
      - 'widgets.html'
      - 'personajes-minecraft.html'
      - 'assets/minecraft-activity-ranking.js'
      - 'cam-room.html'
      - 'cam-join.html'
      - 'gift-catalog.html'
      - 'cloudflare/licenses/**'
      - 'desktop-build/fix_startup.py'
      - 'desktop-build/fix_soundboard_hotkeys.py'
      - 'desktop-build/verify-v602-premium-panels.cjs'
      - 'grena-v4-fixes.css'
      - 'grena-v4-live.js'
      - 'widget-compact.html'
      - 'desktop-build/enable_frameless.py'
      - 'multichat-signal.html'
      - 'viewers-grena-original.html'
      - 'social-overlay-grena-original.html'
      - 'tests/grena-owner-admin-navigation.test.cjs'
      - 'tests/grena-v603-original-widget-separation.test.cjs'
      - 'tests/grena-v602-voice-platforms.test.cjs'
      - 'tests/grena-v602-community-ticker.test.cjs'
      - 'grena-admin-v4.css'
      - 'assets/grena-fullscreen-gift-obs.html'
      - 'assets/grena-premium-catalog-obs.html'
      - 'desktop-build/verify-premium-alpha.cjs'
      - 'desktop-build/smoke-chat.mjs'
      - 'live-panel.html'
      - 'mobile.html'
      - 'desktop-build/verify-upgrade-5127-to-5129.ps1'
      - '.github/workflows/grena-release-v5115.yml'
      - '.github/workflows/grena-release-v5116.yml'
      - '.github/workflows/grena-release-v5117.yml'
      - 'tests/premium-transparent-overlay.test.mjs'
      - '.github/workflows/grena-desktop-from-kit.yml'
  push:
    branches:
      - main
    paths:
      - GRENA_LIVE_Desktop_v5_Kit.zip
      - 'server.mjs'
      - 'grena-avatar.js'
      - 'login.html'
      - 'cloudflare/licenses/**'
      - 'grena-licensing.mjs'
      - 'fish-owner-vault.cjs'
      - 'grena-public-config.json'
      - 'license.html'
      - 'license-admin.html'
      - 'mode.html'
      - 'control-center.js'
      - 'index.html'
      - 'assets/grena-basic-alerts.js'
      - 'assets/grena-basic-alerts.css'
      - 'assets/alerts-theme-picker.js'
      - 'alerts.html'
      - 'afterglow-overlay.html'
      - 'afterglow-studio.html'
      - 'assets/grena-premium-catalog-obs.html'
      - 'assets/grena-fullscreen-gift-obs.html'
      - 'widgets.html'
      - 'personajes-minecraft.html'
      - 'assets/minecraft-activity-ranking.js'
      - 'multichat-overlay.html'
      - 'social-overlay.html'
      - 'social-overlay-classic.html'
      - 'chat.html'
      - 'desktop-bubble.html'
      - 'desktop-bubble-preload.cjs'
      - 'chat-server.mjs'
      - 'chat-realtime-guard.mjs'
      - 'assets/grena-g-icon.png.base64'
      - 'tests/**'
      - 'desktop-build/**'
      - '.github/workflows/grena-release-v5125.yml'
      - '.github/workflows/grena-release-v5129.yml'
      - '.github/workflows/grena-release-v5116.yml'
      - '.github/workflows/grena-release-v5117.yml'
      - '.github/workflows/grena-desktop-from-kit.yml'
      - '.github/workflows/grena-release-v517.yml'
      - '.github/workflows/grena-release-v518.yml'
      - '.github/workflows/grena-release-v519.yml'
      - '.github/workflows/grena-release-v5110.yml'
      - '.github/workflows/grena-release-v5112.yml'
permissions:
  contents: write
concurrency:
  group: grena-windows-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Parse the Windows upgrade regression script before building
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path (Get-Location) 'desktop-build/verify-upgrade-6004-to-6005.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'El script de actualización contiene errores de sintaxis PowerShell. No compilar instalador.'
          }
          Write-Host 'OK: script de upgrade v6.0.4 -> v6.0.5 sin errores de sintaxis.'
      - name: Verify and apply GREÑA Desktop integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "GRENA_LIVE_Desktop_v5_Kit.zip")) {
            throw "Falta GRENA_LIVE_Desktop_v5_Kit.zip en la raiz del repositorio. No se modifica la app."
          }
          Expand-Archive -Path "GRENA_LIVE_Desktop_v5_Kit.zip" -DestinationPath ".kit" -Force
          # The checked-in overlay already implements the current theme renderer.
          # Preserve it instead of running the outdated kit's patch_overlay routine.
          $kitPatch = ".kit/GRENA_LIVE_Desktop_v5/tools/aplicar_a_grena.py"
          $source = Get-Content $kitPatch -Raw -Encoding UTF8
          $pattern = '(?ms)^def patch_overlay\(s\):.*?(?=^def |\z)'
          $matchesFound = [regex]::Matches($source, $pattern)
          if ($matchesFound.Count -ne 1) { throw "Se esperaba una unica funcion patch_overlay en el kit." }
          $replacement = "def patch_overlay(s):" + "`n" + "    return s" + "`n`n"
          $source = [regex]::Replace($source,$pattern,$replacement)
          # The new alert hub already contains eight basic themes; do not overwrite it
          # with the legacy kit's obsolete two/four-style selector.
          $alertsPattern = '(?ms)^def patch_alerts\(s\):.*?(?=^def |\z)'
          if ([regex]::Matches($source,$alertsPattern).Count -ne 1) { throw 'Se esperaba una funcion patch_alerts en el kit.' }
          $source = [regex]::Replace($source,$alertsPattern,("def patch_alerts(s):" + "`n" + "    return s" + "`n`n"))
          [System.IO.File]::WriteAllText((Resolve-Path $kitPatch),$source,[System.Text.UTF8Encoding]::new($false))
          # The current studio already supports Ascension and all modern themes.
          # Old kit patch_studio expects a removed binary original/minecraft selector.
          # Do not overwrite the existing multi-theme studio.
          $studioPattern = '(?ms)^def patch_studio\(s\):.*?(?=^def |\z)'
          if ([regex]::Matches($source,$studioPattern).Count -ne 1) { throw 'Se esperaba una funcion patch_studio en el kit.' }
          $source = [regex]::Replace($source,$studioPattern,("def patch_studio(s):" + "`n" + "    return s" + "`n`n"))
          [System.IO.File]::WriteAllText((Resolve-Path $kitPatch),$source,[System.Text.UTF8Encoding]::new($false))
          # Old v5 picker assumes two themes; preserve the current multi-theme selector.
          $pickerPattern = '(?ms)^def patch_picker\(s\):.*?(?=^def |\z)'
          if ([regex]::Matches($source,$pickerPattern).Count -ne 1) { throw 'Se esperaba una funcion patch_picker en el kit.' }
          $source = [regex]::Replace($source,$pickerPattern,("def patch_picker(s):" + "`n" + "    return s" + "`n`n"))
          [System.IO.File]::WriteAllText((Resolve-Path $kitPatch),$source,[System.Text.UTF8Encoding]::new($false))
                    # Current server settings already validate PixelCraft + eight basic themes.
          $serverPattern = '(?ms)^def patch_server\(s\):.*?(?=^def |\z)'
          if ([regex]::Matches($source,$serverPattern).Count -ne 1) { throw 'Se esperaba una funcion patch_server en el kit.' }
          $source = [regex]::Replace($source,$serverPattern,("def patch_server(s):" + "`n" + "    return s" + "`n`n"))
          [System.IO.File]::WriteAllText((Resolve-Path $kitPatch),$source,[System.Text.UTF8Encoding]::new($false))
                    # Overlay current deliberately imports Domino pack. It is not a duplicated kit patch.
          $guardOld = "if 'grena-theme-packs.js?v=1' in source and path.startswith('afterglow'):"
          $guardNew = "if 'grena-theme-packs.js?v=1' in source and path.startswith('afterglow') and path != 'afterglow-overlay.html':"
          if ([regex]::Matches($source,[regex]::Escape($guardOld)).Count -ne 1) { throw 'No se localizo una sola proteccion de duplicado.' }
          $source = $source.Replace($guardOld,$guardNew)
          [System.IO.File]::WriteAllText((Resolve-Path $kitPatch),$source,[System.Text.UTF8Encoding]::new($false))
                    python -m py_compile $kitPatch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ".kit/GRENA_LIVE_Desktop_v5/tools/aplicar_a_grena.py" "." --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ".kit/GRENA_LIVE_Desktop_v5/tools/aplicar_a_grena.py" "."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fix Node backend packaging and enable startup diagnosis
        shell: pwsh
        run: |
          python desktop-build/fix_startup.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/enable_frameless.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/fix_oauth.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/fix_kick_auth.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/fix_bubble.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/fix_soundboard_hotkeys.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/fix_official_updates.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop-bubble-preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check server.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check fish-user-vault.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check chat-server.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check kick-realtime.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($path in @('grena-licensing.mjs', 'grena-avatar.js', 'grena-community.js')) {
            node --check $path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Set distinct 6.0.5 release-candidate version for preview installer
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $pkg.version = "6.0.5-rc.1"
          $pkg | ConvertTo-Json -Depth 80 | Set-Content package.json -Encoding utf8
          Write-Host "Instalador de prueba: 6.0.5-rc.1, no publicar en GitHub Releases"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Repair and verify Electron updater runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --save-prod --no-audit --no-fund universalify fs-extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "for (const id of ['universalify','fs-extra','electron-updater']) { console.log(id,require.resolve(id)); require(id); }"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify complete Node suite before building installer
        run: npm test
      - name: Verify compact GREÑA Mobile layout and activity history
        run: node --test tests/mobile-one-screen.test.mjs
      - name: Verify voice HTTP fallback and mascot alpha source (pixel CI runs independently)
        shell: pwsh
        run: |
          node --test tests/voice-http-fallback.test.mjs tests/obs-mascot-alpha-hardening.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify official GREÑA Live 6.0.5 version on main (never on pull requests)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($pkg.version -ne "6.0.5") { throw "Versión base inesperada; se cancela publicación estable." }
          Write-Host "Versión oficial verificada: 6.0.5"
      - name: Generate and verify GOLD GREÑA G icon for Windows
        shell: pwsh
        run: |
          npm install --no-save --no-audit --no-fund @resvg/resvg-js@2.6.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --no-input pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/build-grena-icon.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'build/grena-g.ico')) { throw 'Falta el nuevo icono de Windows' }
          $pkg = Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($pkg.build.win.icon -ne 'build/grena-g.ico') { throw 'El exe no usa la nueva G' }
          if ($pkg.build.nsis.installerIcon -ne 'build/grena-g.ico') { throw 'El instalador no usa la nueva G' }
      - name: Verify pack logic
        shell: pwsh
        run: |
          node --test assets/grena-packs/domino/tests/domino.test.js assets/grena-packs/domino/tests/system.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test assets/grena-packs/minecraft/tests/phase1.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/voice-emoji-filter.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop-build/test-bubble-mode.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop-build/test-obs-alert-cam-tiktok.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real OBS transparency and rising bubbles in Chromium
        run: node desktop-build/verify-premium-alpha.cjs
      - name: Compare V4 Premium secondary screens at real 1920x1080 in Chromium
        run: node desktop-build/verify-v602-premium-panels.cjs
      - name: Preserve V4 browser evidence (gifts, mobile QR, widgets, audio, admin)
        uses: actions/upload-artifact@v4
        with:
          name: GRENA-V602-Premium-Visual-1920
          path: dist/v602-visual-evidence/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Probe public Kick authorization broker
        run: node desktop-build/probe-kick-auth.mjs
      - name: Build Windows installer safely (publication happens in verified release workflow)
        env:
          # PRs never get publisher secrets; official builds may sign when a valid certificate is available.
          WIN_CSC_LINK: ${{ github.event_name == 'push' && secrets.GRENA_WINDOWS_CERT_BASE64 || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.GRENA_WINDOWS_CERT_PASSWORD || '' }}
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify mobile dashboard and live panel are packaged
        shell: pwsh
        run: |
          foreach ($file in @('live-panel.html','mobile.html','mobile-device.html','chat-realtime-guard.mjs')) {
            if (!(Test-Path (Join-Path 'dist/win-unpacked/resources/app' $file))) { throw "Falta $file en la aplicación empaquetada" }
          }
      - name: Verify bundled GREÑA G branding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'dist/win-unpacked/resources/app'
          $faviconPath = Join-Path $root 'favicon.svg'
          if (!(Test-Path -LiteralPath $faviconPath)) { throw 'Falta favicon.svg dentro del instalador Windows.' }
          $original = (Get-FileHash -LiteralPath 'favicon.svg' -Algorithm SHA256).Hash
          $bundled = (Get-FileHash -LiteralPath $faviconPath -Algorithm SHA256).Hash
          if ($original -ne $bundled) { throw 'El favicon empaquetado es distinto de la G dorada aprobada.' }
          $favicon = Get-Content -LiteralPath $faviconPath -Raw -Encoding UTF8
          if (!$favicon.Contains('G Dorada') -or !$favicon.Contains('<linearGradient id="body"')) {
            throw 'Se empaquetó el logotipo equivocado: debe ser la G dorada.'
          }
          if ($favicon.Contains('data:image/png;base64,')) {
            throw 'La G azul antigua no debe permanecer incrustada en el favicon.'
          }
          foreach ($file in @('build/grena-g.png','build/grena-g.ico')) {
            if (!(Test-Path -LiteralPath $file)) { throw "Falta el icono generado desde la G dorada: $file" }
          }
          python desktop-build/verify-grena-g-alpha.py build/grena-g.png build/grena-g.ico
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # index.html MUST be the user's V4 HTML, not an old brand icon injected into it.
          $v4Index = Join-Path $root 'index.html'
          $v4Adapter = Join-Path $root 'grena-v4-live.js'
          if (!(Test-Path -LiteralPath $v4Index) -or !(Test-Path -LiteralPath $v4Adapter)) {
            throw 'Falta la interfaz V4 exacta o su adaptador real dentro del instalador.'
          }
          $v4 = Get-Content -LiteralPath $v4Index -Raw -Encoding UTF8
          $ref = Get-Content -LiteralPath 'design/reference/GRENA_LIVE_6_Premium_Interactivo_V4(3).html' -Raw -Encoding UTF8
          $referenceCSS = [regex]::Match($ref,'(?s)<style>(.*?)</style>').Groups[1].Value
          $packageCSS = [regex]::Match($v4,'(?s)<style>(.*?)</style>').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($referenceCSS) -or $packageCSS -cne $referenceCSS) {
            throw 'La interfaz empaquetada modificó el CSS original V4 del usuario.'
          }
          if (!$v4.Contains('<nav class="rail" id="nav"') -or !$v4.Contains('src="/grena-v4-live.js?v=6005"')) {
            throw 'La estructura original V4 o el adaptador real no se empaquetaron.'
          }
          Write-Host 'OK: la interfaz V4 conserva el CSS original sin inyectar el viejo logotipo.'
          $pages = @('login.html','mode.html','alerts.html','gift-catalog.html','afterglow-studio.html','desktop-bubble.html','mobile.html','mobile-device.html')
          foreach ($file in $pages) {
            $target = Join-Path $root $file
            if (!(Test-Path -LiteralPath $target)) { throw "Falta la pantalla: $file" }
            $html = Get-Content -LiteralPath $target -Raw -Encoding UTF8
            if (!$html.Contains('src="/favicon.svg?v=600"')) {
              throw "Esta pantalla no muestra la G dorada: $file"
            }
          }
          $manifest = Get-Content -LiteralPath (Join-Path $root 'assets/mobile.webmanifest') -Raw -Encoding UTF8 | ConvertFrom-Json
          if (@($manifest.icons | Where-Object { $_.src -eq '/favicon.svg' }).Count -lt 1) {
            throw 'GREÑA Mobile no usa el ícono unificado.'
          }
          Write-Host 'OK: EXE y demás ventanas usan la G dorada; el Centro de mando conserva V4 exacto.'
      - name: Verify Minecraft dynamics and shared room files in Windows package
        shell: pwsh
        run: |
          node --check cloudflare/licenses/src/dynamics.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($path in @('dynamics.html','dynamics/questions.mjs','dynamics/shared-rooms.mjs','dynamics/bedrock-websocket.mjs')) {
            if (!(Test-Path (Join-Path 'dist/win-unpacked/resources/app' $path))) {
              throw "Missing Minecraft dynamics packaged file: $path"
            }
          }
      - name: Verify Windows installer Authenticode and SHA256
        shell: pwsh
        env:
          GRENA_SIGNING_EXPECTED: ${{ github.event_name == 'push' && secrets.GRENA_WINDOWS_CERT_BASE64 != '' && 'true' || 'false' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem dist -File -Filter '*.exe' | Where-Object { $_.Name -match 'Setup' })
          if ($installers.Count -ne 1) { throw "Expected exactly one GREÑA Windows installer, found $($installers.Count)" }
          $file = $installers[0]
          $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
          $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
          Write-Host "Installer SHA256: $($hash.Hash)"
          Write-Host "Authenticode: $($signature.Status)"
          if ($signature.Status -eq 'Valid') {
            Write-Host "Verified signer: $($signature.SignerCertificate.Subject)"
          } elseif ($env:GRENA_SIGNING_EXPECTED -eq 'true') {
            throw 'A signing certificate was supplied but the installer is not validly signed.'
          } else {
            Write-Host '::warning title=Windows installer unsigned::Unsigned installers may be blocked by SmartScreen. A real code-signing certificate is still required for publisher reputation.'
          }
      - name: Assert updater dependencies exist in packaged Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appRoot = 'dist/win-unpacked/resources/app'
          if (!(Test-Path $appRoot)) { throw "Falta el directorio de la app desempaquetada: $appRoot" }
          foreach ($module in @('universalify','fs-extra','electron-updater')) {
            $modulePath = Join-Path $appRoot "node_modules/$module"
            if (!(Test-Path $modulePath)) { throw "Dependencia ausente en instalador: $module" }
          }
          $env:GRENA_PACKAGED_APP = (Resolve-Path $appRoot).Path
          node -e "const {createRequire}=require('node:module');const path=require('node:path');const req=createRequire(path.join(process.env.GRENA_PACKAGED_APP,'package.json'));for(const id of ['universalify','fs-extra','electron-updater']){console.log('packaged',id,req.resolve(id));req(id)}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify all four transparent premium themes are packaged in installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appRoot = 'dist/win-unpacked/resources/app'
          foreach ($relative in @('afterglow-overlay.html', 'assets/grena-premium-catalog-obs.html', 'assets/grena-fullscreen-gift-obs.html', 'assets/grena-mascot-alerts.html', 'assets/grenito-original-alerts.html')) {
            $target = Join-Path $appRoot $relative
            if (!(Test-Path -LiteralPath $target)) { throw "Falta alerta en instalador: $relative" }
            $html = Get-Content -LiteralPath $target -Raw -Encoding UTF8
            if (!$html.Contains('color-scheme:normal!important')) { throw "Falta transparencia real en alerta empaquetada: $relative" }
          }
          $overlayHtml = Get-Content -LiteralPath (Join-Path $appRoot 'afterglow-overlay.html') -Raw -Encoding UTF8
          if (!$overlayHtml.Contains("scene.setAttribute('allowtransparency','true')")) { throw 'El instalador perdió la transparencia de los iframes.' }
          Write-Host 'OK: cuatro alertas transparentes incluidas en EXE de GREÑA Live.'
      - name: Verify YouTube streamList protocol and runtime are included in installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='dist/win-unpacked/resources/app'
          foreach ($path in @('youtube-live-stream.proto','youtube-live-stream.mjs')) {
            if (!(Test-Path -LiteralPath (Join-Path $root $path))) { throw "YouTube streaming no incluido en EXE: $path" }
          }
          $env:GRENA_PACKAGED_APP=(Resolve-Path $root).Path
          node -e "const {createRequire}=require('node:module');const path=require('node:path');const req=createRequire(path.join(process.env.GRENA_PACKAGED_APP,'package.json'));for(const mod of ['@grpc/grpc-js','@grpc/proto-loader'])console.log(mod,req.resolve(mod));"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test compiled Windows backend
        shell: pwsh
        run: ./desktop-build/smoke.ps1
      - name: Verify installed upgrade from GREÑA 6.0.4 to 6.0.5 preserves user data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: ./desktop-build/verify-upgrade-6004-to-6005.ps1
      - name: Upload the Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.event_name == 'pull_request' && 'GRENA-LIVE-RC-6.0.5-Windows' || 'GRENA-LIVE-Installer-Windows-v6.0.5' }}
          path: dist/*.exe
          if-no-files-found: error
