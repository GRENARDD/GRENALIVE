name: GREÑA LIVE Desktop (kit de integración)
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - GRENA_LIVE_Desktop_v5_Kit.zip
      - 'starvios-reader.mjs'
      - 'starvios-public-events.mjs'
      - 'server.mjs'
      - 'control-center.js'
      - 'index.html'
      - 'assets/grena-basic-alerts.js'
      - 'assets/grena-basic-alerts.css'
      - 'assets/alerts-theme-picker.js'
      - 'alerts.html'
      - 'afterglow-overlay.html'
      - 'afterglow-studio.html'
      - 'assets/grena-premium-catalog-obs.html'
      - 'assets/grena-fullscreen-gift-obs.html'
      - 'widgets.html'
      - 'multichat-overlay.html'
      - 'social-overlay.html'
      - 'social-overlay-classic.html'
      - 'chat.html'
      - 'desktop-bubble.html'
      - 'desktop-bubble-preload.cjs'
      - 'starvios-viewers.mjs'
      - 'chat-server.mjs'
      - 'tests/starvios-*.test.mjs'
      - 'desktop-build/**'
      - '.github/workflows/grena-desktop-from-kit.yml'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify and apply GREÑA Desktop integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "GRENA_LIVE_Desktop_v5_Kit.zip")) {
            throw "Falta GRENA_LIVE_Desktop_v5_Kit.zip en la raiz del repositorio. No se modifica la app."
          }
          Expand-Archive -Path "GRENA_LIVE_Desktop_v5_Kit.zip" -DestinationPath ".kit" -Force
          # The checked-in overlay already implements the current theme renderer.
          # Preserve it instead of running the outdated kit's patch_overlay routine.
          $kitPatch = ".kit/GRENA_LIVE_Desktop_v5/tools/aplicar_a_grena.py"
          $source = Get-Content $kitPatch -Raw -Encoding UTF8
          $pattern = '(?ms)^def patch_overlay\(s\):.*?(?=^def |\z)'
          $matchesFound = [regex]::Matches($source, $pattern)
          if ($matchesFound.Count -ne 1) { throw "Se esperaba una unica funcion patch_overlay en el kit." }
          $replacement = "def patch_overlay(s):" + "`n" + "    return s" + "`n`n"
          $source = [regex]::Replace($source,$pattern,$replacement)
          # The new alert hub already contains eight basic themes; do not overwrite it
          # with the legacy kit's obsolete two/four-style selector.
          $alertsPattern = '(?ms)^def patch_alerts\(s\):.*?(?=^def |\z)'
          if ([regex]::Matches($source,$alertsPattern).Count -ne 1) { throw 'Se esperaba una funcion patch_alerts en el kit.' }
          $source = [regex]::Replace($source,$alertsPattern,("def patch_alerts(s):" + "`n" + "    return s" + "`n`n"))
          [System.IO.File]::WriteAllText((Resolve-Path $kitPatch),$source,[System.Text.UTF8Encoding]::new($false))
          # The current studio already supports Ascension and all modern themes.
          # Old kit patch_studio expects a removed binary original/minecraft selector.
          # Do not overwrite the existing multi-theme studio.
          $studioPattern = '(?ms)^def patch_studio\(s\):.*?(?=^def |\z)'
          if ([regex]::Matches($source,$studioPattern).Count -ne 1) { throw 'Se esperaba una funcion patch_studio en el kit.' }
          $source = [regex]::Replace($source,$studioPattern,("def patch_studio(s):" + "`n" + "    return s" + "`n`n"))
          [System.IO.File]::WriteAllText((Resolve-Path $kitPatch),$source,[System.Text.UTF8Encoding]::new($false))
          # Old v5 picker assumes two themes; preserve the current multi-theme selector.
          $pickerPattern = '(?ms)^def patch_picker\(s\):.*?(?=^def |\z)'
          if ([regex]::Matches($source,$pickerPattern).Count -ne 1) { throw 'Se esperaba una funcion patch_picker en el kit.' }
          $source = [regex]::Replace($source,$pickerPattern,("def patch_picker(s):" + "`n" + "    return s" + "`n`n"))
          [System.IO.File]::WriteAllText((Resolve-Path $kitPatch),$source,[System.Text.UTF8Encoding]::new($false))
                    # Current server settings already validate PixelCraft + eight basic themes.
          $serverPattern = '(?ms)^def patch_server\(s\):.*?(?=^def |\z)'
          if ([regex]::Matches($source,$serverPattern).Count -ne 1) { throw 'Se esperaba una funcion patch_server en el kit.' }
          $source = [regex]::Replace($source,$serverPattern,("def patch_server(s):" + "`n" + "    return s" + "`n`n"))
          [System.IO.File]::WriteAllText((Resolve-Path $kitPatch),$source,[System.Text.UTF8Encoding]::new($false))
                    # Overlay current deliberately imports Domino pack. It is not a duplicated kit patch.
          $guardOld = "if 'grena-theme-packs.js?v=1' in source and path.startswith('afterglow'):"
          $guardNew = "if 'grena-theme-packs.js?v=1' in source and path.startswith('afterglow') and path != 'afterglow-overlay.html':"
          if ([regex]::Matches($source,[regex]::Escape($guardOld)).Count -ne 1) { throw 'No se localizo una sola proteccion de duplicado.' }
          $source = $source.Replace($guardOld,$guardNew)
          [System.IO.File]::WriteAllText((Resolve-Path $kitPatch),$source,[System.Text.UTF8Encoding]::new($false))
                    python -m py_compile $kitPatch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ".kit/GRENA_LIVE_Desktop_v5/tools/aplicar_a_grena.py" "." --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ".kit/GRENA_LIVE_Desktop_v5/tools/aplicar_a_grena.py" "."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fix Node backend packaging and enable startup diagnosis
        shell: pwsh
        run: |
          python desktop-build/fix_startup.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/fix_oauth.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/fix_starvios_version.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/fix_bubble.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop-bubble-preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check server.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check starvios-public-events.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check starvios-reader.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Starvios white SVG inside OBS widgets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @("social-overlay.html", "social-overlay-classic.html")) {
            $html = Get-Content $path -Raw -Encoding UTF8
            if ($html -notmatch 'aria-label="Starvios"' -or $html -notmatch 'fill="#ffffff"') {
              throw "El widget $path no contiene las estrellas Starvios blancas integradas."
            }
            if ($html -match '<img[^>]+starvios\\.svg') {
              throw "El widget $path vuelve a usar el SVG rosado."
            }
          }
          $preview = Get-Content widgets.html -Raw -Encoding UTF8
          if (-not $preview.Contains('social-overlay.html?preview=1')) {
            throw "La vista previa del widget no tiene activado el modo oscuro."
          }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify complete Node suite before building installer
        run: npm test
      - name: Verify pack logic
        shell: pwsh
        run: |
          node --test assets/grena-packs/domino/tests/domino.test.js assets/grena-packs/domino/tests/system.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test assets/grena-packs/minecraft/tests/phase1.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/voice-emoji-filter.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop-build/test-starvios-dialog.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop-build/test-starvios-realtime.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop-build/test-bubble-mode.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop-build/test-obs-alert-cam-tiktok.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Probe public Kick authorization broker
        run: node desktop-build/probe-kick-auth.mjs
      - name: Build Windows installer (manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publish Windows installer for updates (release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always
      - name: Smoke test compiled Windows backend
        shell: pwsh
        run: ./desktop-build/smoke.ps1
      - name: Upload the Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: GRENA-LIVE-Installer-Windows-v5.0.9
          path: dist/*.exe
          if-no-files-found: error
