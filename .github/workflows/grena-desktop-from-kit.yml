name: GREÑA LIVE Desktop (kit de integración)
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'grena-gamer.css'
      - 'chat-server.mjs'
      - 'server.mjs'
      - 'kick-realtime.mjs'
      - 'tests/kick-*.test.mjs'
      - 'grena-tokens.css'
      - 'grena-avatar.js'
      - 'control-center.js'
      - 'grena-community.js'
      - 'grena-licensing.mjs'
      - 'fish-owner-vault.cjs'
      - 'fish-user-vault.cjs'
      - 'license-admin.html'
      - 'license.html'
      - 'mode.html'
      - 'login.html'
      - 'index.html'
      - 'chat.html'
      - 'alerts.html'
      - 'widgets.html'
      - 'personajes-minecraft.html'
      - 'assets/minecraft-activity-ranking.js'
      - 'cam-room.html'
      - 'cam-join.html'
      - 'gift-catalog.html'
      - 'cloudflare/licenses/**'
      - 'desktop-build/fix_startup.py'
      - 'assets/grena-fullscreen-gift-obs.html'
      - 'assets/grena-premium-catalog-obs.html'
      - 'desktop-build/verify-premium-alpha.cjs'
      - 'tests/premium-transparent-overlay.test.mjs'
      - '.github/workflows/grena-desktop-from-kit.yml'
  push:
    branches:
      - main
    paths:
      - GRENA_LIVE_Desktop_v5_Kit.zip
      - 'starvios-reader.mjs'
      - 'starvios-public-events.mjs'
      - 'server.mjs'
      - 'grena-avatar.js'
      - 'login.html'
      - 'cloudflare/licenses/**'
      - 'grena-licensing.mjs'
      - 'fish-owner-vault.cjs'
      - 'grena-public-config.json'
      - 'license.html'
      - 'license-admin.html'
      - 'mode.html'
      - 'control-center.js'
      - 'index.html'
      - 'assets/grena-basic-alerts.js'
      - 'assets/grena-basic-alerts.css'
      - 'assets/alerts-theme-picker.js'
      - 'alerts.html'
      - 'afterglow-overlay.html'
      - 'afterglow-studio.html'
      - 'assets/grena-premium-catalog-obs.html'
      - 'assets/grena-fullscreen-gift-obs.html'
      - 'widgets.html'
      - 'personajes-minecraft.html'
      - 'assets/minecraft-activity-ranking.js'
      - 'multichat-overlay.html'
      - 'social-overlay.html'
      - 'social-overlay-classic.html'
      - 'chat.html'
      - 'desktop-bubble.html'
      - 'desktop-bubble-preload.cjs'
      - 'starvios-viewers.mjs'
      - 'chat-server.mjs'
      - 'tests/**'
      - 'desktop-build/**'
      - '.github/workflows/grena-desktop-from-kit.yml'
      - '.github/workflows/grena-release-v517.yml'
      - '.github/workflows/grena-release-v518.yml'
      - '.github/workflows/grena-release-v519.yml'
      - '.github/workflows/grena-release-v5110.yml'
      - '.github/workflows/grena-release-v5112.yml'
permissions:
  contents: write
concurrency:
  group: grena-windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Parse the Windows upgrade regression script before building
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path (Get-Location) 'desktop-build/verify-upgrade-5112-to-5113.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'El script de actualización contiene errores de sintaxis PowerShell. No compilar instalador.'
          }
          Write-Host 'OK: script de upgrade v5.1.12 -> v5.1.13 sin errores de sintaxis.'
      - name: Verify and apply GREÑA Desktop integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "GRENA_LIVE_Desktop_v5_Kit.zip")) {
            throw "Falta GRENA_LIVE_Desktop_v5_Kit.zip en la raiz del repositorio. No se modifica la app."
          }
          Expand-Archive -Path "GRENA_LIVE_Desktop_v5_Kit.zip" -DestinationPath ".kit" -Force
          # The checked-in overlay already implements the current theme renderer.
          # Preserve it instead of running the outdated kit's patch_overlay routine.
          $kitPatch = ".kit/GRENA_LIVE_Desktop_v5/tools/aplicar_a_grena.py"
          $source = Get-Content $kitPatch -Raw -Encoding UTF8
          $pattern = '(?ms)^def patch_overlay\(s\):.*?(?=^def |\z)'
          $matchesFound = [regex]::Matches($source, $pattern)
          if ($matchesFound.Count -ne 1) { throw "Se esperaba una unica funcion patch_overlay en el kit." }
          $replacement = "def patch_overlay(s):" + "`n" + "    return s" + "`n`n"
          $source = [regex]::Replace($source,$pattern,$replacement)
          # The new alert hub already contains eight basic themes; do not overwrite it
          # with the legacy kit's obsolete two/four-style selector.
          $alertsPattern = '(?ms)^def patch_alerts\(s\):.*?(?=^def |\z)'
          if ([regex]::Matches($source,$alertsPattern).Count -ne 1) { throw 'Se esperaba una funcion patch_alerts en el kit.' }
          $source = [regex]::Replace($source,$alertsPattern,("def patch_alerts(s):" + "`n" + "    return s" + "`n`n"))
          [System.IO.File]::WriteAllText((Resolve-Path $kitPatch),$source,[System.Text.UTF8Encoding]::new($false))
          # The current studio already supports Ascension and all modern themes.
          # Old kit patch_studio expects a removed binary original/minecraft selector.
          # Do not overwrite the existing multi-theme studio.
          $studioPattern = '(?ms)^def patch_studio\(s\):.*?(?=^def |\z)'
          if ([regex]::Matches($source,$studioPattern).Count -ne 1) { throw 'Se esperaba una funcion patch_studio en el kit.' }
          $source = [regex]::Replace($source,$studioPattern,("def patch_studio(s):" + "`n" + "    return s" + "`n`n"))
          [System.IO.File]::WriteAllText((Resolve-Path $kitPatch),$source,[System.Text.UTF8Encoding]::new($false))
          # Old v5 picker assumes two themes; preserve the current multi-theme selector.
          $pickerPattern = '(?ms)^def patch_picker\(s\):.*?(?=^def |\z)'
          if ([regex]::Matches($source,$pickerPattern).Count -ne 1) { throw 'Se esperaba una funcion patch_picker en el kit.' }
          $source = [regex]::Replace($source,$pickerPattern,("def patch_picker(s):" + "`n" + "    return s" + "`n`n"))
          [System.IO.File]::WriteAllText((Resolve-Path $kitPatch),$source,[System.Text.UTF8Encoding]::new($false))
                    # Current server settings already validate PixelCraft + eight basic themes.
          $serverPattern = '(?ms)^def patch_server\(s\):.*?(?=^def |\z)'
          if ([regex]::Matches($source,$serverPattern).Count -ne 1) { throw 'Se esperaba una funcion patch_server en el kit.' }
          $source = [regex]::Replace($source,$serverPattern,("def patch_server(s):" + "`n" + "    return s" + "`n`n"))
          [System.IO.File]::WriteAllText((Resolve-Path $kitPatch),$source,[System.Text.UTF8Encoding]::new($false))
                    # Overlay current deliberately imports Domino pack. It is not a duplicated kit patch.
          $guardOld = "if 'grena-theme-packs.js?v=1' in source and path.startswith('afterglow'):"
          $guardNew = "if 'grena-theme-packs.js?v=1' in source and path.startswith('afterglow') and path != 'afterglow-overlay.html':"
          if ([regex]::Matches($source,[regex]::Escape($guardOld)).Count -ne 1) { throw 'No se localizo una sola proteccion de duplicado.' }
          $source = $source.Replace($guardOld,$guardNew)
          [System.IO.File]::WriteAllText((Resolve-Path $kitPatch),$source,[System.Text.UTF8Encoding]::new($false))
                    python -m py_compile $kitPatch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ".kit/GRENA_LIVE_Desktop_v5/tools/aplicar_a_grena.py" "." --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ".kit/GRENA_LIVE_Desktop_v5/tools/aplicar_a_grena.py" "."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fix Node backend packaging and enable startup diagnosis
        shell: pwsh
        run: |
          python desktop-build/fix_startup.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/fix_oauth.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/fix_kick_auth.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/fix_starvios_version.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/fix_bubble.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop-build/fix_official_updates.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop-bubble-preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check server.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check fish-user-vault.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check chat-server.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check kick-realtime.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($path in @('grena-licensing.mjs', 'grena-avatar.js', 'grena-community.js')) {
            node --check $path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node --check starvios-public-events.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check starvios-reader.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Starvios white SVG inside OBS widgets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @("social-overlay.html", "social-overlay-classic.html")) {
            $html = Get-Content $path -Raw -Encoding UTF8
            if ($html -notmatch 'aria-label="Starvios"' -or $html -notmatch 'fill="#ffffff"') {
              throw "El widget $path no contiene las estrellas Starvios blancas integradas."
            }
            if ($html -match '<img[^>]+starvios\\.svg') {
              throw "El widget $path vuelve a usar el SVG rosado."
            }
          }
          $preview = Get-Content widgets.html -Raw -Encoding UTF8
          if (-not $preview.Contains('social-overlay.html?preview=1')) {
            throw "La vista previa del widget no tiene activado el modo oscuro."
          }
      - name: Set distinct test-only version for Kick PR build
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $pkg.version = "5.1.13-beta.1"
          $pkg | ConvertTo-Json -Depth 80 | Set-Content package.json -Encoding utf8
          Write-Host "Instalador de prueba: 5.1.13-beta.1, no publicar en GitHub Releases"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Repair and verify Electron updater runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --save-prod --no-audit --no-fund universalify fs-extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "for (const id of ['universalify','fs-extra','electron-updater']) { console.log(id,require.resolve(id)); require(id); }"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify complete Node suite before building installer
        run: npm test
      - name: Set official 5.1.13 version on main (never on pull requests)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($pkg.version -ne "5.1.13") { throw "Versión base inesperada; se cancela publicación estable." }
          $pkg.version = "5.1.13"
          $pkg | ConvertTo-Json -Depth 80 | Set-Content package.json -Encoding utf8
          Write-Host "Versión oficial verificada: 5.1.13"
      - name: Verify pack logic
        shell: pwsh
        run: |
          node --test assets/grena-packs/domino/tests/domino.test.js assets/grena-packs/domino/tests/system.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test assets/grena-packs/minecraft/tests/phase1.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/voice-emoji-filter.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop-build/test-starvios-dialog.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop-build/test-starvios-realtime.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop-build/test-bubble-mode.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop-build/test-obs-alert-cam-tiktok.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real OBS transparency and rising bubbles in Chromium
        run: node desktop-build/verify-premium-alpha.cjs
      - name: Verify Timeline Premium in Chromium, horizontal and vertical OBS
        run: node desktop-build/verify-timeline-premium.cjs
      - name: Probe public Kick authorization broker
        run: node desktop-build/probe-kick-auth.mjs
      - name: Build Windows installer safely (publication happens in verified release workflow)
        env:
          # PRs never get publisher secrets; official builds may sign when a valid certificate is available.
          WIN_CSC_LINK: ${{ github.event_name == 'push' && secrets.GRENA_WINDOWS_CERT_BASE64 || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.GRENA_WINDOWS_CERT_PASSWORD || '' }}
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify Windows installer Authenticode and SHA256
        shell: pwsh
        env:
          GRENA_SIGNING_EXPECTED: ${{ github.event_name == 'push' && secrets.GRENA_WINDOWS_CERT_BASE64 != '' && 'true' || 'false' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem dist -File -Filter '*.exe' | Where-Object { $_.Name -match 'Setup' })
          if ($installers.Count -ne 1) { throw "Expected exactly one GREÑA Windows installer, found $($installers.Count)" }
          $file = $installers[0]
          $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
          $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
          Write-Host "Installer SHA256: $($hash.Hash)"
          Write-Host "Authenticode: $($signature.Status)"
          if ($signature.Status -eq 'Valid') {
            Write-Host "Verified signer: $($signature.SignerCertificate.Subject)"
          } elseif ($env:GRENA_SIGNING_EXPECTED -eq 'true') {
            throw 'A signing certificate was supplied but the installer is not validly signed.'
          } else {
            Write-Host '::warning title=Windows installer unsigned::Unsigned installers may be blocked by SmartScreen. A real code-signing certificate is still required for publisher reputation.'
          }
      - name: Assert updater dependencies exist in packaged Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appRoot = 'dist/win-unpacked/resources/app'
          if (!(Test-Path $appRoot)) { throw "Falta el directorio de la app desempaquetada: $appRoot" }
          if (!(Test-Path (Join-Path $appRoot "timeline-premium.html"))) { throw "La nueva plantilla Timeline Premium no está incluida en el instalador." }
          foreach ($module in @('universalify','fs-extra','electron-updater')) {
            $modulePath = Join-Path $appRoot "node_modules/$module"
            if (!(Test-Path $modulePath)) { throw "Dependencia ausente en instalador: $module" }
          }
          $env:GRENA_PACKAGED_APP = (Resolve-Path $appRoot).Path
          node -e "const {createRequire}=require('node:module');const path=require('node:path');const req=createRequire(path.join(process.env.GRENA_PACKAGED_APP,'package.json'));for(const id of ['universalify','fs-extra','electron-updater']){console.log('packaged',id,req.resolve(id));req(id)}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test compiled Windows backend
        shell: pwsh
        run: ./desktop-build/smoke.ps1
      - name: Verify installed upgrade from GREÑA 5.1.11 preserves user data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: ./desktop-build/verify-upgrade-5112-to-5113.ps1
      - name: Upload the Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: GRENA-LIVE-Installer-Windows-v5.1.13
          path: dist/*.exe
          if-no-files-found: error
