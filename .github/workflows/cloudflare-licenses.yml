name: Publicar licencias Cloudflare
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/licenses/src/worker.mjs'
      - 'cloudflare/licenses/src/updates.mjs'
      - 'cloudflare/licenses/migrations/**'
      - 'tests/beta-license.test.cjs'
      - '.github/workflows/cloudflare-licenses.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify Worker syntax
        run: node --check cloudflare/licenses/src/worker.mjs
      - name: Validate BETA licensing invariants
        run: node --test tests/beta-license.test.cjs
      - name: Apply schema and publish Worker
        working-directory: cloudflare/licenses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Falta CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Falta CLOUDFLARE_ACCOUNT_ID" && exit 1)
          npx --yes wrangler@4 d1 migrations apply DB --remote
          npx --yes wrangler@4 deploy
      - name: Ensure Fish Audio encryption key exists (never rotate an existing key)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {randomBytes} from 'node:crypto';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account)throw Error('Faltan CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID en GitHub.');
          const url='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/workers/scripts/grena-live-licenses/secrets';
          const headers={'Authorization':'Bearer '+token,'Accept':'application/json'};
          const listed=await fetch(url,{headers});
          const existing=await listed.json();
          if(!listed.ok||existing.success!==true||!Array.isArray(existing.result)){
            throw Error('No se pudieron comprobar los secretos del Worker. Revisa permisos Workers Scripts Edit.');
          }
          if(existing.result.some(item=>item.name==='FISH_CREDENTIALS_KEY')){
            console.log('FISH_CREDENTIALS_KEY existente: se conserva intacto.');
          }else{
            const value=randomBytes(32).toString('base64');
            const written=await fetch(url,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},
              body:JSON.stringify({name:'FISH_CREDENTIALS_KEY',type:'secret_text',text:value})});
            const body=await written.json();
            if(!written.ok||body.success!==true)throw Error('Cloudflare rechazó la configuración de FISH_CREDENTIALS_KEY.');
            console.log('FISH_CREDENTIALS_KEY configurado en Cloudflare (valor oculto).');
          }
          NODE
