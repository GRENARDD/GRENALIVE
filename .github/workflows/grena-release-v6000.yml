name: GREÑA · Publicar Desktop v6.0.0 ESTABLE
on:
  workflow_run:
    workflows:
      - GREÑA LIVE Desktop (kit de integración)
    types:
      - completed
    branches:
      - main
permissions:
  contents: write
  actions: read
jobs:
  release:
    # v6.0.0 already published. Never recreate from new 6.0.1 code.
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: '6.0.0'
      TESTED_RUN: ${{ github.event.workflow_run.id }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Skip when v6.0.0 is already official
        id: existing_release
        shell: bash
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION ya está publicada. Los cambios siguientes deben salir como una nueva versión."
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Windows build, current HEAD and release identity
        if: steps.existing_release.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo 'El código de main cambió después de compilar; no publicar un instalador antiguo'; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" --jq .head_sha)" = "$TESTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" --jq .event)" = push
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" --jq .head_branch)" = main
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v6.0.0 ya existe. No sobrescribir una versión oficial.'
            exit 1
          fi
      - name: Assert main declares GREÑA Live 6.0.0 and includes V4 release changes
        if: steps.existing_release.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='6.0.0')process.exit(1)"
          grep -q 'VOICE_USER_COOLDOWN_MS = 4000' chat.html
          grep -q 'G Dorada' favicon.svg
          test -s grena-premium-v6.js
          test -s desktop-build/verify-grena-g-alpha.py
      - name: Verify production GREÑA ID Worker has secure shared rooms
        if: steps.existing_release.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          worker='https://grena-live-licenses.omelicolon18.workers.dev'
          code="$(curl --max-time 15 -sS -o /tmp/grena-health.json -w '%{http_code}' "$worker/health")"
          test "$code" = 200 || { echo "GREÑA Worker health failed: $code"; exit 1; }
          grep -q '"ok":true' /tmp/grena-health.json
          # Cloudflare may deploy after GitHub Windows CI finishes.
          # Wait for the authenticated route rather than publishing an installer
          # that points at a Worker without the new rooms backend.
          ready=false
          for attempt in $(seq 1 18); do
            code="$(curl --max-time 15 -sS -o /tmp/grena-rooms.json -w '%{http_code}' "$worker/api/dynamics/rooms" || true)"
            if test "$code" = 401 && grep -q '"ok":false' /tmp/grena-rooms.json; then
              ready=true
              break
            fi
            echo "Cloudflare rooms not ready (attempt $attempt/18, HTTP $code)."
            sleep 10
          done
          test "$ready" = true || { echo "Rooms API is not deployed or not protected; refusing v6.0.0 stable release."; exit 1; }
      - name: Download and verify compiled 6.0.0 Windows installer
        if: steps.existing_release.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          gh run download "$TESTED_RUN" --repo "$GITHUB_REPOSITORY" --name GRENA-LIVE-Installer-Windows-v6.0.0 --dir dist-release
          mapfile -t installers < <(find dist-release -maxdepth 2 -type f -iname '*6.0.0.exe' -size +60000k)
          test "${#installers[@]}" -eq 1 || { echo "Se esperaba exactamente un instalador estable 6.0.0 (encontrados: ${#installers[@]})"; exit 1; }
          installer="${installers[0]}"
          test -s "$installer"
          mv "$installer" dist-release/GRENA.LIVE.Setup.6.0.0.exe
          exe='GRENA.LIVE.Setup.6.0.0.exe'
          size="$(stat -c '%s' "dist-release/$exe")"
          hash="$(openssl dgst -sha512 -binary "dist-release/$exe" | base64 -w0)"
          test "${#hash}" -ge 70
          printf 'version: %s\nfiles:\n  - url: %s\n    sha512: %s\n    size: %s\npath: %s\nsha512: %s\nreleaseDate: %s\n' "$VERSION" "$exe" "$hash" "$size" "$exe" "$hash" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-release/latest.yml
          ( cd dist-release && sha256sum "$exe" > SHA256SUMS.txt )
          test -s dist-release/latest.yml
      - name: Publish official v6.0.0 release (not Cloudflare rollout)
        if: steps.existing_release.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          GREÑA Live Desktop 6.0.0 — ESTABLE

          IDENTIDAD Y DISEÑO:
          - Interfaz Premium V4 de GREÑA Live 6.0 con navegación y paneles renovados.
          - Nueva G dorada transparente unificada en ventanas, ejecutable e instalador Windows.
          - Compatibilidad con GREÑA ID, roles y licencias.

          STREAMING:
          - Multichat y alertas de TikTok, Twitch, Kick y YouTube.
          - Panel de espectadores, widgets para OBS y edición de sonidos de alertas.
          - Panel GREÑA Mobile integrado.

          CHAT DE VOZ:
          - Se mantiene el funcionamiento anterior del chat de voz.
          - Tiempo fijo de 4 segundos por usuario, sin el nuevo deslizador.

          CALIDAD:
          - Pruebas automatizadas de Windows, backend, integridad del instalador, iconos y overlays.
          - Prueba real de actualización sobre 5.1.27 y conservación de cuentas, configuraciones y voz.
          - Puede aparecer Windows SmartScreen si el instalador carece de firma de editor reconocida.

          La disponibilidad de mensajes, alertas y métricas en directo depende de cada plataforma.
          EOF
          gh release create "v$VERSION" dist-release/GRENA.LIVE.Setup.6.0.0.exe dist-release/latest.yml dist-release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$TESTED_SHA" --title "GREÑA Live Desktop v$VERSION" --notes-file release-notes.md
