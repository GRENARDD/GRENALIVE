name: Starvios validation

on:
  pull_request:
    paths:
      - 'starvios-*.mjs'
      - 'chat-server.mjs'
      - 'server.mjs'
      - 'chat.html'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/starvios-checks.yml'
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check starvios-reader.mjs
      - run: node --check starvios-events.mjs
      - run: node --check chat-server.mjs
      - run: node --check server.mjs
