name: GREÑA OBS · Transparencia Mascot (solo pruebas)
on:
  pull_request:
    paths:
      - 'afterglow-overlay.html'
      - 'assets/grena-mascot-alerts.html'
      - 'assets/grenito-original-alerts.html'
      - 'tests/obs-mascot-alpha-hardening.test.mjs'
      - '.github/workflows/obs-mascot-alpha-check.yml'
permissions:
  contents: read
jobs:
  mascot-alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate both mascot OBS scenes and existing animations
        run: node --test tests/obs-mascot-alpha-hardening.test.mjs tests/mascot-alerts-integration.test.mjs tests/obs-four-premium-alpha.test.mjs tests/obs-premium-regression.test.mjs
