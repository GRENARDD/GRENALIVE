name: GREÑA · Publicar Desktop v6.0.10 estable
on:
  workflow_run:
    workflows:
      - GREÑA LIVE Desktop (kit de integración)
    types:
      - completed
    branches:
      - main
permissions:
  contents: write
  actions: read
jobs:
  release:
    # Publish only after the exact V4 PR is merged and the main Windows CI succeeds.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: '6.0.10'
      TESTED_RUN: ${{ github.event.workflow_run.id }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Skip when v6.0.10 is already official
        id: existing_release
        shell: bash
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION ya está publicada. Los cambios siguientes deben salir como una nueva versión."
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Windows build, current HEAD and release identity
        if: steps.existing_release.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo 'El código de main cambió después de compilar; no publicar un instalador antiguo'; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" --jq .head_sha)" = "$TESTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" --jq .event)" = push
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" --jq .head_branch)" = main
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v6.0.10 ya existe. No sobrescribir una versión oficial.'
            exit 1
          fi
      - name: Verify exact GREÑA Live 6.0.10 Premium V4 reference and adapter
        if: steps.existing_release.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json');if(p.version!=='6.0.10')process.exit(1)"
          test -s index.html
          test -s chat.html
          test -s grena-v4-live.js
          test -s 'design/reference/GRENA_LIVE_6_Premium_Interactivo_V4(3).html'
          node --test tests/grena-v4-exact-template.test.cjs
          node --test tests/grena-v602-premium-panels.test.cjs
          node --test tests/grena-owner-admin-navigation.test.cjs tests/grena-v602-voice-platforms.test.cjs tests/grena-v603-original-widget-separation.test.cjs tests/grena-v602-community-ticker.test.cjs tests/grena-v604-widget-preview-layout.test.cjs tests/grena-signal-obs-parity.test.cjs tests/grena-v605-window-signal-live.test.cjs
          test -s widget-compact.html
          test -s viewers-grena-original.html
          test -s desktop-build/verify-v602-premium-panels.cjs
          test -s desktop-build/verify-upgrade-6005-to-6010.ps1
      - name: Verify production GREÑA ID Worker has secure shared rooms
        if: steps.existing_release.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          worker='https://grena-live-licenses.omelicolon18.workers.dev'
          code="$(curl --max-time 15 -sS -o /tmp/grena-health.json -w '%{http_code}' "$worker/health")"
          test "$code" = 200 || { echo "GREÑA Worker health failed: $code"; exit 1; }
          grep -q '"ok":true' /tmp/grena-health.json
          # Cloudflare may deploy after GitHub Windows CI finishes.
          # Wait for the authenticated route rather than publishing an installer
          # that points at a Worker without the new rooms backend.
          ready=false
          for attempt in $(seq 1 18); do
            code="$(curl --max-time 15 -sS -o /tmp/grena-rooms.json -w '%{http_code}' "$worker/api/dynamics/rooms" || true)"
            if test "$code" = 401 && grep -q '"ok":false' /tmp/grena-rooms.json; then
              ready=true
              break
            fi
            echo "Cloudflare rooms not ready (attempt $attempt/18, HTTP $code)."
            sleep 10
          done
          test "$ready" = true || { echo "Rooms API is not deployed or not protected; refusing v6.0.10 stable release."; exit 1; }
      - name: Download and verify compiled 6.0.10 Windows installer
        if: steps.existing_release.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          gh run download "$TESTED_RUN" --repo "$GITHUB_REPOSITORY" --name GRENA-LIVE-Installer-Windows-v6.0.10 --dir dist-release
          mapfile -t installers < <(find dist-release -maxdepth 2 -type f -iname '*6.0.10.exe' -size +60000k)
          test "${#installers[@]}" -eq 1 || { echo "Se esperaba exactamente un instalador estable 6.0.10 (encontrados: ${#installers[@]})"; exit 1; }
          installer="${installers[0]}"
          test -s "$installer"
          mv "$installer" dist-release/GRENA.LIVE.Setup.6.0.10.exe
          exe='GRENA.LIVE.Setup.6.0.10.exe'
          size="$(stat -c '%s' "dist-release/$exe")"
          hash="$(openssl dgst -sha512 -binary "dist-release/$exe" | base64 -w0)"
          test "${#hash}" -ge 70
          printf 'version: %s\nfiles:\n  - url: %s\n    sha512: %s\n    size: %s\npath: %s\nsha512: %s\nreleaseDate: %s\n' "$VERSION" "$exe" "$hash" "$size" "$exe" "$hash" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-release/latest.yml
          ( cd dist-release && sha256sum "$exe" > SHA256SUMS.txt )
          test -s dist-release/latest.yml
      - name: Publish official v6.0.10 release (not Cloudflare rollout)
        if: steps.existing_release.outputs.already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          GREÑA Live Desktop v6.0.10 — ESTABLE

          CORRECCIONES:
          - Chat de Voz Fish Audio: la interfaz Premium V4 recupera automáticamente el iframe de voz al fallar el inicio del servicio y permite activar el interruptor cuando el motor esté listo, sin crear motores duplicados.
          - Chat de Voz: un clic de activación durante la conexión no se pierde y la interfaz conserva el diseño negro y dorado.
          - YouTube: el lector vuelve a buscar el chat LIVE si falla el descubrimiento inicial, caduca el chat o expira el cursor.
          - YouTube: al fallar repetidamente streamList se usa el sondeo REST oficial como respaldo, respetando los límites de la API.
          - Widgets YouTube: las cifras no publicadas por Google ya no se confunden con 0 espectadores; los ceros reales siguen siendo cero y las lecturas antiguas expiran.
          - Diagnóstico YouTube autenticado: indica separadamente el estado del chat y la última fuente de espectadores.

          SIN CAMBIOS DE DISEÑO:
          - Se mantiene el Centro de mando Premium V4 negro y dorado, los contadores transparentes y los cuatro canales.
          - Se mantienen las cuentas GREÑA ID, voces, ajustes, licencias, widgets OBS y alertas del usuario.

          VALIDACIÓN:
          - Publicación condicionada al resultado satisfactorio de GitHub Actions en Windows, suite Node y pruebas de empaquetado.
          - Comprobación de actualización real de la versión oficial 6.0.9 a 6.0.10 conservando archivos por perfil y configuración local.
          - La recepción efectiva de comentarios y espectadores requiere un LIVE real en un canal YouTube vinculado. Si YouTube oculta concurrentViewers, el programa no inventa el valor.
          - Puede aparecer SmartScreen si el instalador no tiene firma de editor reconocida.
          EOF
          gh release create "v$VERSION" dist-release/GRENA.LIVE.Setup.6.0.10.exe dist-release/latest.yml dist-release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$TESTED_SHA" --title "GREÑA Live Desktop v$VERSION" --notes-file release-notes.md
