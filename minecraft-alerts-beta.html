<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREÑA Minecraft Alerts — Beta</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c25;color:#fff;font:15px system-ui}header{padding:18px;background:#182e3a}h2{margin:0}p{color:#b9cbd1}.wrap{max-width:1000px;margin:auto;padding:18px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}button,select,input{background:#274557;color:#fff;border:1px solid #648292;border-radius:5px;padding:11px;cursor:pointer}.stage{position:relative;aspect-ratio:16/9;max-height:550px;overflow:hidden;border:2px solid #526e70;border-radius:8px;background:linear-gradient(#80c2ed 0 65%,#6ba343 65%)}.stage.vertical{aspect-ratio:9/16;max-width:340px;max-height:600px;margin:auto}.stage.transparent{background:repeating-conic-gradient(#394651 0 25%,#26353e 0 50%) 0/28px 28px}.layer{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-start;padding-top:6%;pointer-events:none}.vertical .layer{padding-top:14%}.alert{text-align:center;opacity:0;transform:translateY(-40px) scale(.8);transition:.3s}.alert.on{opacity:1;transform:translateY(0) scale(1)}canvas{image-rendering:pixelated;width:145px;height:145px;filter:drop-shadow(5px 8px 1px #1119)}.title{font:900 clamp(17px,3vw,29px) monospace;color:#fff;text-shadow:3px 3px #1b1b1b,-2px -2px #1b1b1b,4px 5px #000}.name{font:900 20px monospace;color:#ffe680;text-shadow:2px 2px #111}.platform{font:700 12px monospace;background:#1c333ccc;padding:4px 9px;display:inline-block;margin-top:6px}.hint{font-size:12px}</style></head><body><header><h2>⛏ GREÑA — Minecraft Alerts BETA</h2><p>Pruebas visuales aisladas. No activa ni modifica alertas reales.</p></header><div class="wrap"><div class="buttons"><button data-type="follow">Seguidor</button><button data-type="subscribe">Suscripción</button><button data-type="rose">Rosa</button><button data-type="diamond">Diamante</button><button data-type="chest">Cofre</button><button data-type="heart">Corazón</button><button data-type="unknown">Regalo desconocido</button></div><div class="buttons"><label>Plataforma <select id="platform"><option>TikTok</option><option>Twitch</option><option>Kick</option><option>Starvios</option></select></label><label>Usuario <input id="username" value="Greña_Fan"></label><label>Formato <select id="format"><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option></select></label><label><input type="checkbox" id="transparent"> Fondo de prueba transparente</label></div><div class="stage" id="stage"><div class="layer"><div class="alert" id="alert"><canvas width="32" height="32" id="sprite"></canvas><div class="title" id="title"></div><div class="name" id="name"></div><div class="platform" id="tag"></div></div></div></div><p class="hint">Este panel es una vista previa independiente. Para recibir regalos reales, falta conectar el motor visual al WebSocket autenticado de GREÑA LIVE y verificar los datos de cada plataforma.</p></div><script>
const patterns={
diamond:['....CCCC....','...CBBBB C...'.replaceAll(' ',''),'..CBBBBBBC..','.CBBBBBBBBC.','CBBBBBBBBBBC','CCCCCCCCCCCC','.CBBBBBBBBC.','..CBBBBBBC..','...CBBBB C...'.replaceAll(' ',''),'....CCCC....'],
rose:['....RRRR....','...RRRRRR...','....RRRR....','.....GG.....','....GG......','...GGGG.....','.....GG.....','.....GG.....','.....GG.....'],
heart:['.RRR...RRR.','RRRRR.RRRRR','RRRRRRRRRRR','RRRRRRRRRRR','.RRRRRRRRR.','..RRRRRRR..','...RRRRR...','....RRR....','.....R.....'],
chest:['BBBBBBBBBBBB','BYYYYYYYYYYB','BYOOOOOOOOYB','BYOOOOOOOOYB','BYOOOYYOOOYB','BYOOOYYOOOYB','BYOOOOOOOOYB','BBBBBBBBBBBB'],
rose2:['....RRRR....','...RRRRRR...','....RRRR....','.....GG.....','....GG......','...GGGG.....','.....GG.....','.....GG.....'],
follow:['...SSSSSS...','..SSSSSSSS..','..SWWWW W S..'.replaceAll(' ',''),'..SWBBBWWS..','..SWWWW W S..'.replaceAll(' ',''),'..SSSSSSSS..','...DDDDDD...','..DDDDDDDD..','..DDDDDDDD..','..DDDDDDDD..'],
unknown:['BBBBBBBBBBBB','BYYYYYYYYYYB','BYOOOOOOOOYB','BYOOOYYOOOYB','BYOOOYYOOOYB','BYOOOOOOOOYB','BBBBBBBBBBBB']};
const colors={C:'#cfffff',B:'#357eb5',R:'#f04454',G:'#368e43',Y:'#ffe58b',O:'#b47634',S:'#b88654',W:'#ffe1b0',D:'#44c5e0'};
const canvas=document.getElementById('sprite'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;let timeout;
function draw(key){ctx.clearRect(0,0,32,32);const rows=patterns[key]||patterns.unknown;const width=Math.max(...rows.map(r=>r.length));const ox=Math.floor((32-width*2)/2),oy=Math.floor((32-rows.length*2)/2);rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(colors[ch]){ctx.fillStyle=colors[ch];ctx.fillRect(ox+x*2,oy+y*2,2,2)}}))}
function show(type){clearTimeout(timeout);const a=document.getElementById('alert');a.classList.remove('on');const titles={follow:'¡NUEVO SEGUIDOR!',subscribe:'¡NUEVA SUSCRIPCIÓN!',rose:'¡REGALO: ROSA!',diamond:'¡REGALO: DIAMANTE!',chest:'¡REGALO: COFRE!',heart:'¡REGALO: CORAZÓN!',unknown:'¡NUEVO REGALO!'};draw(type==='subscribe'?'chest':type==='rose'?'rose':type);document.getElementById('title').textContent=titles[type];document.getElementById('name').textContent=document.getElementById('username').value||'Usuario';document.getElementById('tag').textContent=document.getElementById('platform').value;requestAnimationFrame(()=>a.classList.add('on'));timeout=setTimeout(()=>a.classList.remove('on'),4200)}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>show(b.dataset.type));document.getElementById('format').onchange=e=>document.getElementById('stage').classList.toggle('vertical',e.target.value==='vertical');document.getElementById('transparent').onchange=e=>document.getElementById('stage').classList.toggle('transparent',e.target.checked);
</script></body></html>
