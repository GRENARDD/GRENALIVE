<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grena_RD · Viewers</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: transparent; display: flex; align-items: center; justify-content: center;
         font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  .wrap { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 28px 44px; padding: 20px; }

  .item { --c: #fff; display: flex; align-items: center; gap: 14px;
          opacity: 0; transform: translateY(18px) scale(.9);
          animation: entrada .7s cubic-bezier(.2,.9,.3,1.2) forwards, flotar 3.6s ease-in-out infinite;
          animation-delay: var(--d), calc(var(--d) + .7s); }
  .item:nth-child(1) { --d: 0s; } .item:nth-child(2) { --d: .15s; } .item:nth-child(3) { --d: .3s; }
  .item:nth-child(4) { --d: .45s; } .item:nth-child(5) { --d: .6s; }

  .ico { position: relative; width: 46px; height: 46px; flex: none; animation: latido 2.4s ease-in-out infinite; animation-delay: var(--d); }
  .ico svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ico .main { fill: var(--c); filter: drop-shadow(0 0 7px var(--c)) drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
  .ico::before { content: ""; position: absolute; inset: -9px; border-radius: 50%;
                 background: radial-gradient(circle, color-mix(in srgb, var(--c) 40%, transparent), transparent 68%);
                 animation: aura 2.4s ease-in-out infinite; animation-delay: var(--d); }

  .txt { display: flex; flex-direction: column; line-height: 1; }
  .plat { display: flex; align-items: center; gap: 7px; font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase;
          font-weight: 700; color: var(--c); text-shadow: 0 1px 4px rgba(0,0,0,.85); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); animation: vivo 1.4s ease-in-out infinite; }

  .num { display: flex; align-items: center; margin: 6px 0 0; font-size: 38px; font-weight: 800; color: #fff;
         font-variant-numeric: tabular-nums; filter: drop-shadow(0 0 9px var(--c)) drop-shadow(0 2px 3px rgba(0,0,0,.8)); }
  .col { display: inline-block; height: 1em; width: .62em; overflow: hidden; line-height: 1; text-align: center; }
  .roll { display: block; transition: transform 1s cubic-bezier(.2,.8,.2,1); }
  .roll span { display: block; height: 1em; line-height: 1; }
  .sep { display: inline-block; width: .3em; text-align: center; line-height: 1; }
  .lbl { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,.85); text-shadow: 0 1px 4px rgba(0,0,0,.85); }

  .twitch { --c: #9146ff; } .kick { --c: #53fc18; } .youtube { --c: #ff1a1a; }
  .tiktok { --c: #25f4ee; }
  .tiktok .ico .main { fill: #fff; filter: drop-shadow(-2px 0 5px #25f4ee) drop-shadow(2px 0 5px #fe2c55) drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
  .tiktok .plat { text-shadow: 2px 1px 0 #fe2c55, 0 1px 4px rgba(0,0,0,.85); }
  .tiktok .dot { background: #fe2c55; box-shadow: 0 0 8px #fe2c55; }
  .tiktok .num { filter: drop-shadow(-2px 0 6px #25f4ee) drop-shadow(2px 0 6px #fe2c55) drop-shadow(0 2px 3px rgba(0,0,0,.8)); }
  .tiktok .ico::before { background: radial-gradient(circle at 32% 50%, rgba(37,244,238,.5), transparent 60%), radial-gradient(circle at 68% 50%, rgba(254,44,85,.5), transparent 60%); }
  .tiktok .ico .cy, .tiktok .ico .pk { fill: #25f4ee; opacity: .9; mix-blend-mode: screen; animation: glitch-a 1.8s steps(1) infinite; }
  .tiktok .ico .pk { fill: #fe2c55; animation-name: glitch-b; }


  @keyframes entrada { to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes flotar { 0%,100% { translate: 0 0; } 50% { translate: 0 -5px; } }
  @keyframes latido { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  @keyframes aura { 0%,100% { opacity: .35; transform: scale(.9); } 50% { opacity: .9; transform: scale(1.15); } }
  @keyframes vivo { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  @keyframes glitch-a { 0%,100% { transform: translate(-1.5px,0); } 20% { transform: translate(-3px,1px); } 40% { transform: translate(-1px,-1px); } 60% { transform: translate(-2.5px,0); } 80% { transform: translate(-1.5px,1px); } }
  @keyframes glitch-b { 0%,100% { transform: translate(1.5px,0); } 20% { transform: translate(3px,-1px); } 40% { transform: translate(1px,1px); } 60% { transform: translate(2.5px,0); } 80% { transform: translate(1.5px,-1px); } }
  @media (prefers-reduced-motion: reduce) { .item, .ico, .ico::before, .dot, .cy, .pk { animation: none !important; opacity: 1 !important; transform: none !important; } .roll { transition: none; } }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-twitch" viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.43l-3 3v-3H6.857V1.714h13.714Z"/></symbol>
      <symbol id="i-kick" viewBox="0 0 24 24"><path d="M1.333 0h8v5.333H12V2.667h2.667V0h8v8H20v2.667h-2.667v2.666H20V16h2.667v8h-8v-2.667H12v-2.666H9.333V24h-8Z"/></symbol>
      <symbol id="i-tiktok" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></symbol>
      <symbol id="i-youtube" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/><path fill="#fff" d="M9.545 15.568V8.432L15.818 12z"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></symbol>
    </defs>
  </svg>

  <div class="wrap">
    <div class="item twitch"><div class="ico"><svg class="main"><use href="#i-twitch"/></svg></div>
      <div class="txt"><span class="plat"><i class="dot"></i>Twitch</span><div class="num" data-k="twitch"></div></div></div>
    <div class="item kick"><div class="ico"><svg class="main"><use href="#i-kick"/></svg></div>
      <div class="txt"><span class="plat"><i class="dot"></i>Kick</span><div class="num" data-k="kick"></div></div></div>
    <div class="item tiktok"><div class="ico"><svg class="cy"><use href="#i-tiktok"/></svg><svg class="pk"><use href="#i-tiktok"/></svg><svg class="main"><use href="#i-tiktok"/></svg></div>
      <div class="txt"><span class="plat"><i class="dot"></i>TikTok</span><div class="num" data-k="tiktok"></div></div></div>
    <div class="item youtube"><div class="ico"><svg class="main"><use href="#i-youtube"/></svg></div>
      <div class="txt"><span class="plat"><i class="dot"></i>YouTube</span><div class="num" data-k="youtube"></div></div></div>
  </div>

<script>
  const vals={twitch:0,kick:0,tiktok:0,youtube:0};
  function pintar(el,n){
    const s=Math.max(0,Math.round(Number(n)||0)).toLocaleString('en-US');
    if(el.dataset.len!==String(s.length)){
      el.innerHTML='';
      for(const ch of s){
        if(/\d/.test(ch)){
          const col=document.createElement('span');col.className='col';
          const roll=document.createElement('span');roll.className='roll';
          for(let i=0;i<10;i++){const d=document.createElement('span');d.textContent=i;roll.appendChild(d);}
          col.appendChild(roll);el.appendChild(col);
        }else{const sep=document.createElement('span');sep.className='sep';sep.textContent=ch;el.appendChild(sep);}
      }
      el.dataset.len=s.length;void el.offsetWidth;
    }
    const digits=s.replace(/\D/g,'');
    el.querySelectorAll('.roll').forEach((r,i)=>{r.style.transform='translateY('+(-digits[i])+'em)';});
  }
  function actualizar(){document.querySelectorAll('.num').forEach(el=>pintar(el,vals[el.dataset.k]));}
  window.setViewers=function(o){for(const k of Object.keys(vals)){if(Number.isFinite(Number(o?.[k])))vals[k]=Math.max(0,Number(o[k]));}actualizar();};
  window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='grena-viewers'&&e.data.viewers)window.setViewers(e.data.viewers)});
  async function refresh(){try{const params=new URLSearchParams(location.search);const obs=params.get('obs');const url='/api/viewers'+(obs?'?obs='+encodeURIComponent(obs):'');const r=await fetch(url,{cache:'no-store'});if(r.ok){const d=await r.json();if(d.viewers)window.setViewers(d.viewers);}}catch{}}
  actualizar();refresh();setInterval(refresh,3000);
</script>
</body>
</html>
