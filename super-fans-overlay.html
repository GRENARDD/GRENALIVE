<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREÑA · Top del día</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden;background:transparent}
body{font-family:Impact,"Arial Narrow",Inter,"Segoe UI",system-ui,sans-serif;color:#fff}body.demo{background:radial-gradient(ellipse at 30% 0%,#171726,#07070b 70%)}
#fx{position:fixed;left:0;bottom:0;width:100%;height:220px;pointer-events:none;z-index:0}
.wrap{position:fixed;left:0;right:0;bottom:max(28px,env(safe-area-inset-bottom,0px));z-index:1}
.card{position:relative;display:flex;align-items:center;gap:clamp(14px,2.2vw,38px);padding:20px clamp(18px,2.6vw,48px) 18px;
 text-shadow:0 3px 14px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.95);animation:enter .8s cubic-bezier(.16,1,.3,1) both}
.card.out{animation:leave .75s ease-in both}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:rgba(255,255,255,.14)}
.bar{position:absolute;left:0;right:0;top:0;height:5px}
.bar::after{content:"";position:absolute;inset:0;background:var(--c);transform-origin:left;animation:drain var(--t) linear forwards;box-shadow:0 0 16px var(--c),0 0 40px var(--c)}
.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}.slash{position:absolute;top:-10%;left:-20%;width:14%;height:120%;transform:skewX(-22deg);mix-blend-mode:screen;
 background:linear-gradient(90deg,transparent,var(--c) 40%,#fff 50%,var(--c) 60%,transparent);animation:slash 1s ease-out both}
.flash{position:absolute;inset:0;background:radial-gradient(ellipse at 0 50%,var(--c),transparent 55%);animation:flash .7s ease-out both}
.tag{flex:none;display:flex;flex-direction:column;gap:2px;background:var(--c);color:#000;font-family:Impact,"Arial Narrow",sans-serif;letter-spacing:.14em;
 padding:8px 16px 6px;transform:skewX(-14deg);text-shadow:none;text-transform:uppercase;box-shadow:0 0 24px var(--c)}
.tag b{font-weight:900;font-size:clamp(14px,1.4vw,22px);line-height:1}
.tag small{font-size:clamp(9px,.8vw,12px);letter-spacing:.2em;opacity:.8}
.plat{position:relative;flex:none;font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(40px,5vw,88px);line-height:1;letter-spacing:.015em;
 text-transform:uppercase;color:var(--c);text-shadow:0 0 34px var(--c),0 4px 10px rgba(0,0,0,.9);animation:slam .6s .15s cubic-bezier(.2,1.6,.4,1) both}
.plat::before,.plat::after{content:attr(data-t);position:absolute;left:0;top:0;opacity:.85;animation:glitch .7s .2s steps(2) both;mix-blend-mode:screen}
.plat::before{color:#00e5ff;transform:translateX(-5px)}.plat::after{color:#ff0055;transform:translateX(5px)}
.user{display:flex;align-items:center;gap:10px;min-width:0;font-size:clamp(20px,2.2vw,40px);font-weight:900;animation:rise .6s .4s ease both;font-family:Inter,"Segoe UI",sans-serif}
.user .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.crown{flex:none;filter:drop-shadow(0 0 10px #ffd54a)}
.stats{display:flex;gap:clamp(16px,2.4vw,44px);margin-left:auto;flex:none;animation:rise .6s .5s ease both}
.stat b{display:block;font-size:clamp(26px,3vw,54px);line-height:1}.stat span{font-family:Inter,"Segoe UI",sans-serif;font-size:clamp(8px,.75vw,12px);
 font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.78)}
@keyframes enter{from{clip-path:polygon(0 0,0 0,-6% 100%,0 100%)}to{clip-path:polygon(0 0,106% 0,100% 100%,0 100%)}}
@keyframes leave{0%{filter:none}14%{filter:brightness(2.4);transform:translateX(-8px)}28%{transform:translateX(9px);filter:brightness(1.4)}42%{transform:translateX(-4px);filter:none}100%{clip-path:polygon(0 0,0 0,-6% 100%,0 100%);opacity:0;transform:translateX(-40px)}}
@keyframes slash{from{left:-20%;opacity:1}to{left:115%;opacity:0}}@keyframes flash{from{opacity:.7}to{opacity:0}}
@keyframes slam{from{transform:scale(1.5) translateX(-20px);opacity:0}to{transform:none;opacity:1}}
@keyframes glitch{0%{clip-path:inset(10% 0 60% 0)}25%{clip-path:inset(55% 0 10% 0);transform:translateX(7px)}50%{clip-path:inset(30% 0 35% 0);transform:translateX(-7px)}75%{clip-path:inset(70% 0 5% 0)}100%{clip-path:inset(0 0 100% 0);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
body.vertical .wrap{width:min(380px,94%);left:3%;right:auto;bottom:4%;}body.vertical.right .wrap{left:auto;right:3%}
body.vertical .card{flex-direction:column;align-items:flex-start;padding:16px 16px 22px;gap:8px}body.vertical .plat{font-size:62px}
body.vertical .user{font-size:27px}body.vertical .stats{width:100%;margin-left:0;justify-content:space-between}
body.vertical .stat b{font-size:36px}body.vertical .tag{flex-direction:row;gap:12px}
@media(max-width:760px){body:not(.vertical) .card{flex-wrap:wrap}body:not(.vertical) .stats{margin-left:0}}
@media(prefers-reduced-motion:reduce){.card,.card *{animation:none!important}}
</style></head><body><canvas id="fx"></canvas><div class="wrap" id="slot"></div>
<script>
(()=>{'use strict';
const params=new URLSearchParams(location.search),demo=location.hash.includes('demo')||params.get('preview')==='1';
if(params.get('layout')==='vertical')document.body.classList.add('vertical');
if(params.get('side')==='right')document.body.classList.add('right');
if(demo)document.body.classList.add('demo');
const SHOW_MS=demo?8000:30000,PERIOD_MS=demo?14000:330000,FIRST_MS=demo?800:3000;
const platforms=['kick','tiktok','twitch'],palettes={kick:'#53fc18',twitch:'#a970ff',tiktok:'#25F4EE'};
const display={kick:'KICK',twitch:'TWITCH',tiktok:'TIKTOK'};
let dailyTops={},index=0,hideTimer,nextTimer,particlesActive=false,color='#fff',particles=[];
const slot=document.getElementById('slot'),cv=document.getElementById('fx'),cx=cv.getContext('2d');
const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const fmt=n=>Number(n)>=1000?(Number(n)/1000).toFixed(1).replace('.0','')+'K':String(Math.round(Number(n)||0));
const rounded=n=>Number.isFinite(Number(n))?Number(n):0;
const preview={kick:{nickname:'UsuarioKick',dailyStats:{comments:482,minutes:390,shares:37}},twitch:{nickname:'UsuarioTwitch',dailyStats:{comments:318,minutes:240,shares:21}},tiktok:{nickname:'UsuarioTikTok',dailyStats:{comments:1250,minutes:470,shares:96}}};
function resize(){cv.width=innerWidth;cv.height=220}resize();addEventListener('resize',resize);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
(function sparks(){
 cx.clearRect(0,0,cv.width,cv.height);
 if(particlesActive&&!reduce)for(let i=0;i<Math.ceil(cv.width/500);i++)particles.push({x:Math.random()*cv.width,y:cv.height-30,vx:(Math.random()-.5)*.8,vy:-(.6+Math.random()*1.6),life:1,size:1+Math.random()*2});
 particles=particles.filter(x=>x.life>0);
 for(const x of particles){x.x+=x.vx;x.y+=x.vy;x.life-=.012;cx.globalAlpha=Math.max(0,x.life);cx.fillStyle=color;cx.shadowColor=color;cx.shadowBlur=10;cx.fillRect(x.x,x.y,x.size,x.size)}
 cx.globalAlpha=1;requestAnimationFrame(sparks);
})();
function animateNums(el){
 const targets=[...el.querySelectorAll('[data-n]')],start=performance.now();function frame(now){const t=Math.min(1,Math.max(0,(now-start-300)/(reduce?1:1200))),factor=1-(1-t)**3;
 for(const target of targets){const n=rounded(target.dataset.n)*factor;target.textContent=target.dataset.h==='1'?n.toFixed(1)+'H':fmt(n)}
 if(t<1&&el.isConnected)requestAnimationFrame(frame)}requestAnimationFrame(frame);
}
function refreshDay(){return new Intl.DateTimeFormat('es-DO',{day:'numeric',month:'short',timeZone:'America/Santo_Domingo'}).format(new Date()).toUpperCase()}
function show(){
 const p=platforms[index];const user=demo?preview[p]:(dailyTops[p]||[])[0];if(!user){slot.replaceChildren();return}
 const st=user.dailyStats||{};const hours=Math.max(0,rounded(st.minutes)/60);const displayUser=user.nickname||user.user||'Fan';
 const markup=`<div class="card" style="--c:${palettes[p]};--t:${SHOW_MS}ms">
 <div class="fx"><div class="flash"></div><div class="slash"></div></div><div class="bar"></div>
 <div class="tag"><b>👑 Top del día</b><small>${refreshDay()}</small></div>
 <div class="plat" data-t="${esc(display[p])}">${esc(display[p])}</div>
 <div class="user"><span class="crown">👑</span><span class="nm">@${esc(displayUser)}</span></div>
 <div class="stats"><div class="stat"><b data-n="${rounded(st.comments)}">0</b><span>Comentarios</span></div>
 <div class="stat"><b data-n="${hours.toFixed(2)}" data-h="1">0H</b><span>Tiempo activo aprox.</span></div>
 <div class="stat"><b data-n="${rounded(st.shares)}">0</b><span>Compartió el LIVE</span></div></div></div>`;
 slot.innerHTML=markup;color=palettes[p];particlesActive=true;animateNums(slot.firstElementChild);
}
function hide(){particlesActive=false;const el=slot.firstElementChild;if(!el)return;el.classList.add('out');setTimeout(()=>{if(slot.firstElementChild===el)slot.replaceChildren()},800)}
function cycle(){
 // No dejar OBS vacío durante cinco minutos si el turno pertenece a una
 // plataforma sin actividad, mientras otra sí tiene un Super Fan.
 if(!demo){
  const available=platforms.filter(p=>(dailyTops[p]||[]).length>0);
  if(!available.length){slot.replaceChildren();nextTimer=setTimeout(cycle,15000);return}
  for(let n=0;n<platforms.length;n++){
   if((dailyTops[platforms[index]]||[]).length)break;
   index=(index+1)%platforms.length;
  }
 }
 show();clearTimeout(hideTimer);hideTimer=setTimeout(hide,SHOW_MS);
 index=(index+1)%platforms.length;nextTimer=setTimeout(cycle,PERIOD_MS)
}
function use(data){if(data?.dailyTops)dailyTops=data.dailyTops}
async function load(){try{const obs=params.get('obs');const r=await fetch('/api/loyalty?limit=1'+(obs?'&obs='+encodeURIComponent(obs):''),{cache:'no-store'});if(r.ok){const data=await r.json();use(data.loyalty)}}catch{}}
function connect(){const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+(params.get('obs')?'/?obs='+encodeURIComponent(params.get('obs')):''));ws.onmessage=e=>{try{const d=JSON.parse(e.data);if((d.type==='hello'||d.type==='loyalty-update')&&d.loyalty)use(d.loyalty)}catch{}};ws.onclose=()=>setTimeout(connect,2500);ws.onerror=()=>ws.close()}
load();connect();setInterval(load,30000);nextTimer=setTimeout(cycle,FIRST_MS);
})();
</script></body></html>
