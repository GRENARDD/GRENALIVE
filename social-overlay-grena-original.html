<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:transparent;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.wrap{display:flex;flex-direction:row;flex-wrap:nowrap;justify-content:center;align-items:center;gap:28px 40px;padding:20px}
.item{--c:#fff;display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(18px) scale(.9);animation:entrada .7s cubic-bezier(.2,.9,.3,1.2) forwards,flotar 3.6s ease-in-out infinite;animation-delay:var(--d),calc(var(--d) + .7s)}
.item:nth-child(1){--d:0s}.item:nth-child(2){--d:.2s}.item:nth-child(3){--d:.4s}.item:nth-child(4){--d:.6s}
.ico{position:relative;width:46px;height:46px;flex:none;animation:latido 2.4s ease-in-out infinite;animation-delay:var(--d)}
.ico svg{position:absolute;inset:0;width:100%;height:100%}
.ico .main{fill:var(--c);filter:drop-shadow(0 0 7px var(--c)) drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.ico::before{content:"";position:absolute;inset:-9px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 40%,transparent),transparent 68%);animation:aura 2.4s ease-in-out infinite;animation-delay:var(--d)}
.txt{display:flex;flex-direction:column;line-height:1.1}
.plat{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;color:var(--c);text-shadow:0 1px 4px rgba(0,0,0,.85)}
.user{font-size:26px;font-weight:800;white-space:nowrap;color:transparent;background:linear-gradient(100deg,#fff 0%,#fff 40%,var(--c) 50%,#fff 60%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 2px 4px rgba(0,0,0,.85));animation:brillo 3.2s linear infinite;animation-delay:var(--d)}
.twitch{--c:#9146ff}.kick{--c:#53fc18}.tiktok{--c:#ffffff}.youtube{--c:#ff1a1a}
.tiktok .ico .cy,.tiktok .ico .pk{fill:#25f4ee;opacity:.9;mix-blend-mode:screen;animation:glitch-a 1.8s steps(1) infinite}
.tiktok .ico .pk{fill:#fe2c55;animation-name:glitch-b}
@keyframes entrada{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes flotar{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes aura{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:.9;transform:scale(1.15)}}
@keyframes brillo{0%{background-position:120% 0}100%{background-position:-120% 0}}
@keyframes glitch-a{0%,100%{transform:translate(-1.5px,0)}20%{transform:translate(-3px,1px)}40%{transform:translate(-1px,-1px)}60%{transform:translate(-2.5px,0)}80%{transform:translate(-1.5px,1px)}}
@keyframes glitch-b{0%,100%{transform:translate(1.5px,0)}20%{transform:translate(3px,-1px)}40%{transform:translate(1px,1px)}60%{transform:translate(2.5px,0)}80%{transform:translate(1.5px,-1px)}}
@media(prefers-reduced-motion:reduce){.item,.ico,.ico::before,.user,.cy,.pk{animation:none!important;opacity:1!important;transform:none!important}}

<script>
const defaults={twitch:'Grena_RD',kick:'Grena_RD',tiktok:'Grena_RD',youtube:'Grena_RD_YT'};
let draft=null,previous='';
function apply(settings){
 const overrides=settings.socialNameOverrides||{};
 for(const platform of Object.keys(defaults)){
  const key=platform+'User';
  const value=String(overrides[platform]||settings[key]||defaults[platform]).trim().replace(/^@/,'').slice(0,80);
  document.querySelector('[data-network="'+platform+'"]').textContent=value||defaults[platform];
 }
}
async function refresh(){
 if(draft)return;
 try{const r=await fetch('/api/social-settings',{cache:'no-store'});if(!r.ok)return;const j=await r.json();const s=JSON.stringify(j.settings||{});if(s!==previous){previous=s;apply(j.settings||{})}}catch{}
}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='grena-social-preview'){draft=e.data.settings;apply(draft||{})}});
refresh();setInterval(refresh,2000);
</script></body></html>
